        slightly when the signer distribution varies slightly. We then analyze three natural samplers – uniform,
        mimicking, and partitioning – under our model with respect to a family of signer distributions modeled after
        empirical Bitcoin data. We hope that our work paves the way towards researching ring samplers from a theoretical
        point of view. '
  - year: 2020
    papers:
    - title: Threshold Password-Hardened Encryption Services
      abstract: Password-hardened encryption (PHE) was introduced by Lai et al. at USENIX 2018 and immediately productized
        by VirgilSecurity. PHE is a password-based key derivation protocol that involves an oblivious external crypto
        service for key derivation. The security of PHE protects against offline brute-force attacks, even when
        the attacker is given the entire database. Furthermore, the crypto service neither learns the derived key
        nor the password. PHE supports key-rotation meaning that both the server and crypto service can update their
        keys without involving the user. While PHE significantly strengthens data security, it introduces a single
        point of failure because key-derivation always requires access to the crypto service. In this work, we address
        this issue and simultaneously increase security by introducing threshold password-hardened encryption. Our
        formalization of this primitive revealed shortcomings of the original PHE definition that we also address
        in this work. Following the spirit of prior works, we give a simple and efficient construction using lightweight
        tools only. We also implement our construction and evaluate its efficiency. Our experiments confirm the
        practical efficiency of our scheme and show that it is more efficient than common memory-hard functions,
        such as scrypt. From a practical perspective this means that threshold PHE can be used as an alternative
        to scrypt for password protection and key-derivation, offering better security in terms of offline brute
        force attacks.
      abstract_source: /publications/2020_Threshold_Password-Hardened_Encryption_Services.pdf
      authors: Julian Brost, Christoph Egger, Russell W. F. Lai, Fritz Schmid, Dominique Schröder, and Markus Zoppelt
      published: ACM CCS
      pages: 409-424
      type: 0
      myurl: 2020_Threshold_Password-Hardened_Encryption_Services.pdf
    - title: Verifiable Timed Signatures Made Practical
      authors: Sri A. K. Thyagarajan, Adithya Bhat, Giulio Malavolta, Nico Döttling,  Aniket Kate, and Dominique
        Schröder
      published: ACM CCS
      pages: 1733-1750
      myurl: 2020_Verifiable_Timed_Signatures_Made_Practical.pdf
      abstract: 'A verifiable timed signature (VTS) scheme allows one to time-lock a signature on a known message
        for a given amount of time T such that after performing a sequential computation for time T anyone can extract
        the signature from the time-lock. Verifiability ensures that anyone can publicly check if a time-lock contains
        a valid signature on the message without solving it first, and that the signature can be obtained by solving
        the same for time T. This work formalizes VTS, presents efficient constructions compatible with BLS, Schnorr,
        and ECDSA signatures, and experimentally demonstrates that these constructions can be employed in practice.
        On a technical level, we design an efficient cut-and-choose protocol based on the homomorphic time-lock
        puzzles to prove the validity of a signature encapsulated in a time-lock puzzle. We also present a new efficient
        range proof protocol that significantly improves upon existing proposals in terms of the proof size, and
        is also of independent interest. While VTS is a versatile tool with numerous existing applications, we demonstrate
        VTS’s applicability to resolve three novel challenging issues in the space of cryptocurrencies. Specif-
        ically, we show how VTS is the cryptographic cornerstone to construct: (i) Payment channel networks with
        improved on-chain unlinkability of users involved in a transaction, (ii) multi- party signing of transactions
        for cryptocurrencies without any on-chain notion of time and (iii) cryptocurrency-enabled fair multi-party
        computation protocol.'
      type: 0
    - title: The Patient as Genomic Data Manager - Evaluation of the PROMISE App.
      authors: '    Lena Griebel, Marc Hinderer, Ali Amr, Benjamin Meder, Marc Schweig, Dominic Deuber, Christoph
        Egger, Claudia Kawohl, Annika Krämer, Isabell Flade, Dominique Schröder, Hans-Ulrich Prokosch'
      published: MIE
      pages: 1061-1065
      myurl: 2020_The_Patient_as_Genomic_Data_Manager–Evaluation_of_the_PROMISE.pdf
      abstract: PROMISE (Personal Medical Safe) was a German research project which aimed to provide the responsibility
        of genomic data to the patient via a mobile app. The patient should accept or decline study requests to
        use his/her genomic data via the app. In the evaluation of the app the experiences with mobile health as
        well as the opinion on being the genomic data manager were measured. Furthermore, the test patients were
        asked about their opinion and their concerns on the PROMISE app. Most of the 19 test patients were aware
        of the high sensibility of genomic data and thought that the PROMISE app was a suitable solution. The largest
        part found it good that they were the responsible data owner. However, several participants also found it
        important to have a permanent contact person when it comes to questions on inquiries or the app.
      type: 0
    - title: Feasibility and Infeasibility of Secure Computation with Malicious PUFs
      date: 2020
      authors: Dana Dachman-Soled, Nils Fleischhacker, Jonathan Katz, Anna Lysyanskaya, and Dominique Schröder
      published: Journal of Cryptology
      impact: 1.3
      pages: 595-617
      myurl: 2021_Feasibility_and_Infeasibility_of_Secure_Computation_with_Malicious_PUFs.pdf
      abstract: 'A recent line of work has explored the use of physically uncloneable functions (PUFs) for secure
        computation, with the goals of (1) achieving universal composability without additional setup, and/or (2)
        obtaining unconditional security (i.e., avoiding complexity-theoretic assump- tions). Initial work assumed
        that all PUFs, even those created by an attacker, are honestly generated. Subsequently, researchers have
        investigated models in which an adversary can create malicious PUFs with arbitrary behavior. Researchers
        have considered both malicious PUFs that might be stateful, as well as malicious PUFs that can have arbitrary
        behavior but are guaranteed to be stateless. We settle the main open questions regarding secure computation
        in the malicious-PUF model: --  We prove that unconditionally secure oblivious transfer is impossible, even
        in the stand- alone setting, if the adversary can construct (malicious) stateful PUFs. --  If the attacker
        is limited to creating (malicious) stateless PUFs, then universally compos- able two-party computation is
        possible without computational assumptions.'
      type: 1
  - year: 2019
    papers:
    - title: 'Omniring: Scaling Up Private Payments Without Trusted Setup - Formal Foundations and Constructions
        of Ring Confidential Transactions with Log-size Proofs'
      abstract: "Monero is the largest cryptocurrency with built-in cryptographic privacy features. The transactions\
        \ are authenticated using zero-knowledge spend proofs, which provide a certain level of anonymity by hiding\
        \ the source accounts from which the funds are sent among a set of other accounts. Due to its similarities\
        \ to ring signatures, this core cryptographic component is called Ring Confidential Transactions (RingCT).\
        \ Because of its practical relevance, several works attempt to analyze the security of RingCT. Since RingCT\
        \ is rather complex, most of them are either informal, miss fundamental functionalities, or introduce undesirable\
        \ trusted setup assumptions. Regarding efficiency, Monero currently deploys a scheme in which the size of\
        \ the spend proof is linear in the ring size. This limits the ring size to only a few accounts, which in\
        \ turn limits the acquired anonymity significantly and facilitates de-anonymization attacks. \n\nAs a solution\
        \ to these problems, we present the first rigorous formalization of RingCT as a cryptographic primitive.\
        \ We then propose a generic construction of RingCT and prove it secure in our formal security model. By\
        \ instantiating our generic construction with new efficient zero-knowledge proofs, we obtain Omniring, a\
        \ fully-fledged RingCT scheme in the discrete logarithm setting that provides the highest concrete and asymptotic\
        \ efficiency as of today. Omniring is the first RingCT scheme which 1) does not require a trusted setup\
        \ or pairing-friendly elliptic curves, 2) has a proof size logarithmic in the size of the ring, and 3) allows\
        \ to share the same ring between all source accounts in a transaction, thereby enabling significantly improved\
        \ privacy level without sacrificing performance. Our zero-knowledge proofs rely on novel enhancements to\
        \ the Bulletproofs framework (S&P 2018), which we believe are of independent interest."
      abstract_source: /publications/2019_Omniring_Scaling_Private_Payments_Without_Trusted_Setup.pdf
      date: 2019
      authors: Russell W. F. Lai, Viktoria Ronge, Tim Ruffing,  Dominique Schröder, Sri A. K. Thyagarajan, and J.Wang
      published: ACM CCS
      pages: 31-48
      myurl: 2019_Omniring_Scaling_Private_Payments_Without_Trusted_Setup.pdf
      type: 0
    - title: Efficient Invisible and Unlinkable Sanitizable Signatures
      abstract: "Sanitizable signatures allow designated parties (the sanitizers) to apply arbitrary modifications\
        \ to some restricted parts of signed messages. A secure scheme should not only be unforgeable, but also\
        \ protect privacy and hold both the signer and the sanitizer accountable. Two important security properties\
        \ that are seemingly difficult to achieve simultaneously and efficiently are invisibility and unlinkability.\
        \ While invisibility ensures that the admissible modifications are hidden from external parties, unlinkability\
        \ says that sanitized signatures cannot be linked to their sources. Achieving both properties simultaneously\
        \ is crucial for applications where sensitive personal data is signed with respect to data-dependent admissible\
        \ modifications. The existence of an efficient construction achieving both properties was recently posed\
        \ as an open question by Camenisch et al. (PKC’17). \n\nIn this work, we propose a solution to this problem\
        \ with a two-step construction. First, we construct (non-accountable) invisible and unlinkable sanitizable\
        \ signatures from signatures on equivalence classes and other basic primitives. Second, we put forth a generic\
        \ transformation using verifiable ring signatures to turn any non-accountable sanitizable signature into\
        \ an accountable one while preserving all other properties. When instantiating in the generic group and\
        \ random oracle model, the efficiency of our construction is comparable to that of prior constructions,\
        \ while providing stronger security guarantees."
      abstract_source: /publications/2019_Efficient_Invisible_and_Unlinkable_Sanitizable_Signatures.pdf
      date: 2019
      authors: Xavier Bultel, Pascal Lafourcade, Rusell W.F. Lai, Giulio Malavolta, Dominique Schröder, and Sri
        A. K. Thyagarajan
      published: PKC
      pages: 159-189
      myurl: 2019_Efficient_Invisible_and_Unlinkable_Sanitizable_Signatures.pdf
      type: 0
    - title: 'My Genome Belongs to Me: Controlling Third Party Computation on Genomic Data'
      date: 2019
      authors: Dominic Deuber, Christoph Egger, Katharina Fech, Giulio Malavolta, Sri A. K. Thyagarajan, Florian
        Battke, Claudia Durand, and Dominique Schröder
      published: PETS
      pages: 108-132
      myurl: 2019_My_Genome_Belongs_to_Me_Controlling_Third_Party_Computation_on_Genomic_Data.pdf
      type: 0
      abstract: 'An individual’s genetic information is pos- sibly the most valuable personal information. While
        knowledge of a person’s DNA sequence can facilitate the diagnosis of several heritable diseases and allow
        per- sonalized treatment, its exposure comes with significant threats to the patient’s privacy. Currently
        known so- lutions for privacy-respecting computation require the owner of the DNA to either be heavily involved
        in the execution of a cryptographic protocol or to completely outsource the access control to a third party.
        This mo- tivates the demand for cryptographic protocols which enable computation over encrypted genomic
        data while keeping the owner of the genome in full control. We envi- sion a scenario where data owners can
        exercise arbitrary and dynamic access policies, depending on the intended use of the analysis results and
        on the credentials of who is conducting the analysis. At the same time, data own- ers are not required to
        maintain a local copy of their entire genetic data and do not need to exhaust their computational resources
        in an expensive cryptographic protocol. In this work, we present METIS, a system that assists the computation
        over encrypted data stored in the cloud while leaving the decision on admissible computa- tions to the data
        owner. It is based on garbled circuits and supports any polynomially-computable function. A critical feature
        of our system is that the data owner is free from computational overload and her communica- tion complexity
        is independent of the size of the input data and only linear in the size of the circuit’s output. We demonstrate
        the practicality of our approach with an implementation and an evaluation of several functions over real
        datasets. '
    - title: Tight Security Proofs for Schnorr Signatures
      date: 2019
      authors: Nils Fleischhacker, Tibor Jager, and Dominique Schröder
      published: Journal of Cryptology
      impact: 1.3
      type: 1
      pages: 566-599
      myurl: 2019_On_Tight_Security_Proofs_forSchnorr_Signatures.pdf
      abstract: The Schnorr signature scheme is the most efficient signature scheme based on the discrete logarithm
        problem and a long line of research investigates the existence of a tight security reduction for this scheme
        in the random oracle model. Almost all re- cent works present lower tightness bounds and most recently Seurin
        (Eurocrypt 2012) showed that under certain assumptions the non-tight security proof for Schnorr sig- natures
        in the random oracle by Pointcheval and Stern (Eurocrypt 1996) is essentially optimal. All previous works
        in this direction rule out tight reductions from the (one- more) discrete logarithm problem. In this paper
        we introduce a new meta-reduction technique, which shows lower bounds for the large and very natural class
        of generic reductions. A generic reduction is independent of a particular representation of group elements.
        Most reductions in state-of-the-art security proofs have this property. It is desirable, because then the
        reduction applies generically to any concrete instantiation of the group. Our approach shows unconditionally
        that there is no tight generic reduc- tion from any natural non-interactive computational problem Π defined
        over algebraic groups to breaking Schnorr signatures, unless solving Π is easy. In an additional application
        of the new meta-reduction technique, we also uncon- ditionally rule out any (even non-tight) generic reduction
        from natural non-interactive computational problems defined over algebraic groups to breaking Schnorr signatures
        in the non-programmable random oracle model.
    - title: (Efficient) Universally Composable Oblivious Transfer Using a Minimal Number of Stateless Tokens
      date: 2019
      comment: Invited from TCC 2018
      authors: Seung Geol Choi, Jonathan Katz, Dominique Schröder, Arkady Yerukhimovich, Hong-Sheng Zhou
      published: Journal of Cryptology
      impact: 1.3
      type: 1
      pages: 459-497
      myurl: 2019_Efficient_Universall_Composable_Oblivious_Transfer_Using_a_Minimal_Number_of_Stateless_Tokens.pdf
      abstract: 'We continue the line of work initiated by Katz (Eurocrypt 2007) on using tamper-proof hardware
        tokens for universally composable secure computation. As our main result, we show an oblivious-transfer
        (OT) protocol in which two parties each create and exchange a single, stateless token and can then run an
        unbounded number of OTs. We also show a more efficient protocol, based only on standard symmetric-key primitives
        (block ciphers and collision-resistant hash functions), that can be used if a bounded number of OTs suffice.

        Motivated by this result, we investigate the number of stateless tokens needed for universally composable
        OT. We prove that our protocol is optimal in this regard for constructions making black-box use of the tokens
        (in a sense we define). We also show that nonblack-box techniques can be used to obtain a construction using
        only a single stateless token.'
    - title: Group ORAM for privacy and access control in outsourced personal records
      date: 2019
      authors: Matteo Maffei, Giulio Malavolta, Manuel Reinert, Dominique Schröder
      published: Journal of Computer Security
      pages: 1-47
      type: 1
      myurl: 2019_Group_ORAM_for_privacy_and_access_control_in_outsourced_personal_records.pdf
      abstract: Cloud storage has rapidly become a cornerstone of many IT infrastructures, constituting a seamless
        solution for the backup, synchronization, and sharing of large amounts of data. Putting user data in the
        direct control of cloud service providers, however, raises security and privacy concerns related to the
        integrity of outsourced data, the accidental or intentional leakage of sensitive information, the profiling
        of user activities and so on. Furthermore, even if the cloud provider is trusted, users having access to
        outsourced files might be malicious and misbehave. These concerns are particularly serious in sensitive
        applications like personal health records and credit score systems. To tackle this problem, we present GORAM,
        a cryptographic system that protects the se- crecy and integrity of outsourced data with respect to both
        an untrusted server and malicious clients, guarantees the anonymity and unlinkability of accesses to such
        data, and allows the data owner to share outsourced data with other clients, selectively granting them read
        and write per- missions. GORAM is the first system to achieve such a wide range of security and privacy
        properties for outsourced storage. In the process of designing an efficient construction, we de- veloped
        two new, generally applicable cryptographic schemes, namely, batched zero-knowledge proofs of shuffle and
        an accountability technique based on chameleon signatures, which we con- sider of independent interest.
        We implemented GORAM in Amazon Elastic Compute Cloud (EC2) and ran a performance evaluation demonstrating
        the scalability and efficiency of our construction.
  - year: 2018
    papers:
    - title: Homomorphic Secret Sharing for Low Degree Polynomials
      date: 2018
      authors: Russell W. F. Lai, Giulio Malavolta, and Dominique Schröder
      published: ASIACRYPT
      pages: 279-309
      myurl: 2018_Homomorphic_Secret_Sharing_for_Low_Degree_Polynomials.pdf
      type: 0
      abstract: Homomorphic secret sharing (HSS) allows n clients to secret-share data to m servers, who can then
        homomorphically evaluate public functions over the shares. A natural application is outsourced computation
        over private data. In this work, we present the first plain-model homomorphic secret sharing scheme that
        supports the evaluation of polynomials with degree higher than 2. Our construction relies on any degree-k
        (multi-key) homomorphic encryption scheme and can evaluate degree-((k + 1)m − 1) polynomials, for any polynomial
        number of inputs n and any sub-logarithmic (in the security parameter) number of servers m. At the heart
        of our work is a series of combinatorial arguments on how a polynomial can be split into several low-degree
        polynomials over the shares of the inputs, which we believe is of independent interest.
    - title: Simple Password-Hardened Encryption Services
      abstract: Passwords and access control remain the popular choice for protecting sensitive data stored online,
        despite their well-known vulnerability to brute-force attacks. A natural solution is to use encryption.
        Although standard practices of using encryption somewhat alleviate the problem, decryption is often needed
        for utility, and keeping the decryption key within reach is obviously dangerous. To address this seemingly
        unavoidable problem in data security, we propose password-hardened encryption (PHE). With the help of an
        external crypto server, a service provider can recover the user data encrypted by PHE only when an end user
        supplied a correct password. PHE inherits the security features of passwordhardening (Usenix Security ’15),
        adding protection for the user data. In particular, the crypto server does not learn any information about
        any user data. More importantly, both the crypto server and the service provider can rotate their secret
        keys, a proactive security mechanism mandated by the Payment Card Industry Data Security Standard (PCI DSS).
        We build an extremely simple password-hardened encryption scheme. Compared with the state-of-the-art password-hardening
        scheme (Usenix Security ’17), our scheme only uses minimal number-theoretic operations and is, therefore,
        30% - 50% more efficient. In fact, our extensive experimental evaluation demonstrates that our scheme can
        handle more than 525 encryption and (successful) decryption requests per second per core, which shows that
        it is lightweight and readily deployable in large-scale systems. Regarding security, our scheme also achieves
        a stronger soundness property, which puts less trust on the good behavior of the crypto server.
      abstract_source: /publications/2018_Simple_Password-Hardened_Encryption_Services.pdf
      date: 2018
      authors: Russell W. F. Lai, Christoph Egger, Manuel Reinert, Sherman S. M. Chow, Matteo Maffei, and Dominique
        Schröder
      published: USENIX
      pages: 1405-1421
      myurl: 2018_Simple_Password-Hardened_Encryption_Services.pdf
      type: 0
    - title: Functional Credentials
      abstract: 'A functional credential allows a user to anonymously prove possession of a set of attributes that
        fulfills a certain policy. The policies are arbitrary polynomially computable predicates that are evaluated
        over arbitrary attributes. The key feature of this primitive is the delegation of verification to third
        parties, called designated verifiers. The delegation protects the privacy of the policy: A designated verifier
        can verify that a user satisfies a certain policy without learning anything about the policy itself. We
        illustrate the usefulness of this property in different applications, including outsourced databases with
        access control. We present a new framework to construct functional credentials that does not require (non-interactive)
        zero-knowledge proofs. This is important in settings where the statements are complex and thus the resulting
        zero-knowledge proofs are not efficient. Our construction is based on any predicate encryption scheme and
        the security relies on standard assumptions. A complexity analysis and an experimental evaluation confirm
        the practicality of our approach.'
      abstract_source: /publications/2018_Functional_Credentials.pdf
      date: 2018
      authors: Dominic Deuber, Matteo Maffei, Giulio Malavolta, Max Rabkin, Dominique Schröder, Mark Simkin.
      published: PETS
      pages: 64-84
      myurl: 2018_Functional_Credentials.pdf
      type: 0
    - title: 'Burning Zerocoins for Fun and for Profit: A Cryptographic Denial-of-Spending Attack on the Zerocoin
        Protocol'
      abstract: Zerocoin (Miers et. al, IEEE S&P’13), designed as an extension to Bitcoin and similar cryptocurrencies,
        was the first anonymous cryptocurrency proposal which supports large anonymity sets. We identify a cryptographic
        denial-of-spending attack on the original Zerocoin protocol and a second Zerocoin protocol (Groth and Kohlweiss,
        EUROCRYPT’15), which enables a network attacker to destroy money of honest users. The attack leads to real-world
        vulnerabilities in multiple cryptocurrencies, which rely on implementations of the original Zerocoin protocol.
        The existence of the attack does not contradict the formal security analyses of the two Zerocoin protocols
        but exposes the lack of an important missing property in the security model of Zerocoin. While the security
        definitions model that the attacker should not be able to create money out of thin air or steal money from
        honest users, it does not model that the attacker cannot destroy money of honest users. Fortunately, there
        are simple fixes for the security model and for both protocols.
      abstract_source: /publications/2018_Burning_Zerocoins_for_Fun_and_for_Profit.pdf
      date: 2018
      authors: Tim Ruffing, Sri A. K. Thyagarajan, Viktoria Ronge, Dominique Schröder
      published: Crypto Valley Conference on Blockchain Technology
      pages: 116-119
      myurl: 2018_Burning_Zerocoins_for_Fun_and_for_Profit.pdf
      type: 0
  - year: 2017
    papers:
    - title: Subset Predicate Encryption and Its Applications
      abstract: 'In this work we introduce the notion of Subset Predicate Encryption, a form of attribute-based
        encryption (ABE) in which a message is encrypted with respect to a set s0 and the resulting ciphertext can
        be decrypted by a key that is associated with a set s if and only if s ⊆ s0 . We formally define our primitive
        and identify several applications. We also propose two new constructions based on standard assumptions in
        bilinear groups; the constructions have very efficient decryption algorithms (consisting of one and two
        pairing computations, respectively) and small keys: in both our schemes, private keys contain only two group
        elements. We prove selective security of our constructions without random oracles. We demonstrate the usefulness
        of Subset Predicate Encryption by describing several black-box transformations to more complex primitives,
        such as identity-based encryption with wildcards and ciphertext-policy ABE for DNF formulas over a small
        universe of attributes. All of the resulting schemes are as efficient as the base Subset Predicate Encryption
        scheme in terms of decryption and key generation.'
      abstract_source: /publications/2018_Subset_Predicate_Encryption_and_Its_Applications.pdf
      date: 2017
      authors: Jonathan Katz, Matteo Maffei, Giulio Malavolta, and Dominique Schröder
      published: CANS
      myurl: 2018_Subset_Predicate_Encryption_and_Its_Applications.pdf
      type: 0
    - title: On the Security of Frequency-Hiding Order-Preserving Encryption
      abstract: 'Order-preserving encryption (OPE) is an encryption scheme with the property that the ordering of
        the plaintexts carry over to the ciphertexts. This primitive is particularly useful in the setting of encrypted
        databases because it enables efficient range queries over encrypted data. Given its practicality and usefulness
        in the design of databases on encrypted data, OPE’s popularity is growing. Unfortunately, nearly all computationally
        efficient OPE constructions are vulnerable against ciphertext frequency-leakage, which allows for inferring
        the underlying plaintext frequency. To overcome this weakness, Kerschbaum recently proposed a security model,
        designed a frequency-hiding OPE scheme, and analyzed its security in the programmable random oracle model
        (CCS 2015).


        In this work, we demonstrate that Kerschbaum’s definition is imprecise and using its natural interpretation,
        we describe an attack against his scheme. We generalize our attack and show that his definition is, in fact,
        not satisfiable. The basic idea of our impossibility result is to show that any scheme satisfying his security
        notion is also IND-CPA-secure, which contradicts the very nature of OPE. As a consequence, no such scheme
        can exist. To complete the picture, we rule out the imprecision in the security definition and show that
        a slight adaption of Kerschbaum’s tree-based scheme fulfills it.'
      abstract_source: https://secpriv.tuwien.ac.at/fulltext/publik_268468.pdf
      date: 2017
      authors: Matteo Maffei, Manuel Reinert, and Dominique Schröder
      published: CANS
      pages: 115-134
      myurl: 0
      type: 0
    - title: Efficient Ring Signatures in the Standard Model
      abstract: "A ring signature scheme allows one party to sign messages on behalf of an arbitrary set of users,\
        \ called the ring. The anonymity of the scheme guarantees that the signature does not reveal which member\
        \ of the ring signed the message. The ring of users can be selected ”on-thefly” by the signer and no central\
        \ coordination is required. Ring signatures have made their way into practice in the area of privacy-enhancing\
        \ technologies and they build the core of several cryptocurrencies. Despite their popularity, almost all\
        \ ring signature schemes are either secure in the random oracle model or in the common reference string\
        \ model. The only candidate instantiations in the plain model are either impractical or not fully functional.\
        \ In this work, we close this gap by proposing a new construction paradigm for ring signatures without random\
        \ oracles: We show how to efficiently instantiate full-fledged ring signatures from signature schemes with\
        \ rerandomizable keys and non-interactive zero-knowledge. We obtain the following results: \n\n- The first\
        \ almost practical ring signature in the plain model from standard assumptions in bilinear groups. \n\n\
        - The first efficient ring signature in the plain model secure under a generalization of the knowledge of\
        \ exponent assumption."
      abstract_source: /publications/2017_Efficient_Ring_Signatures_in_the_Standard_Model.pdf
      date: 2017
      authors: Giulio Malavolta and Dominique Schröder
      published: ASIACRYPT
      pages: 128-157
      myurl: 2017_Efficient_Ring_Signatures_in_the_Standard_Model.pdf
      type: 0
    - title: 'Phoenix: Rebirth of a Cryptographic Password-Hardening Service'
      abstract: 'Password remains the most widespread means of authentication, especially on the Internet. As such,
        it is the Achilles heel of many modern systems. Facebook pioneered using external cryptographic services
        to harden password-based authentication in a large scale. Everspaugh et al. (Usenix Security ’15) provided
        the first comprehensive treatment of such a service and proposed the Pythia PRF-Service as a cryptographically
        secure solution. Recently, Schneider et al. (ACM CCS ’16) proposed a more efficient solution which is secure
        in a weaker security model. In this work, we show that the scheme of Schneider et al. is vulnerable to offline
        attacks just after a single validation query. Therefore, it defeats the purpose of using an external crypto
        service in the first place and it should not be used in practice. Our attacks do not contradict their security
        claims, but instead show that their definitions are simply too weak. We thus suggest stronger security definitions
        that cover these kinds of real-world attacks, and an even more efficient construction, Phoenix, to achieve
        them. Our comprehensive evaluation confirms the practicability of Phoenix: It can handle up to 50% more
        requests than the scheme of Schneider et al. and up to three times more than Pythia.'
      abstract_source: /publications/2017_Phoenix_Rebirth_of_a_Cryptographic_Password-Hardening_Service.pdf
      date: 2017
      authors: Russell W.F.Lai, Christoph Egger, Dominique Schröder, and Sherman S.M.Chow
      published: USENIX
      pages: 899-916
      myurl: 2017_Phoenix_Rebirth_of_a_Cryptographic_Password-Hardening_Service.pdf
      type: 0
    - title: Maliciously Secure Multi-Client ORAM
      abstract: "Oblivious RAM (ORAM) has emerged as an enabling technology to secure cloud-based storage services.\
        \ The goal of this cryptographic primitive is to conceal not only the data but also the access patterns\
        \ from the server. While the early constructions focused on a single client scenario, a few recent works\
        \ have focused on a setting where multiple clients may access the same data, which is crucial to support\
        \ data sharing applications. All these works, however, either do not consider malicious clients or they\
        \ significantly constrain the definition of obliviousness and the system’s practicality. It is thus an open\
        \ question whether a natural definition of obliviousness can be enforced in a malicious multi-client setting\
        \ and, if so, what the communication and computational lower bounds are. \n\nIn this work, we formalize\
        \ the notion of maliciously secure multi-client ORAM, we prove that the server-side computational complexity\
        \ of any secure realization has to be Ω(n), and we present a cryptographic instantiation of this primitive\
        \ based on private information retrieval techniques, which achieves an O(√N) communication complexity. We\
        \ further devise an efficient access control mechanism, built upon a novel and generally applicable realization\
        \ of plaintext equivalence proofs for ciphertext vectors. Finally, we demonstrate how our lower bound can\
        \ be bypassed by leveraging a trusted proxy, obtaining logarithmic communication and server-side computational\
        \ complexity. We implemented our scheme and conducted an experimental evaluation, demonstrating the feasibility\
        \ of our approach."
      abstract_source: /publications/2017_Maliciously_Secure_Multi-Client_ORAM.pdf
      date: 2017
      authors: Matteo Maffei, Giulio Malavolta, Manuel Reinert, and Dominique Schröder
      published: ACNS
      pages: 645-664
      myurl: 2017_Maliciously_Secure_Multi-Client_ORAM.pdf
      type: 0
    - title: Security of Blind Signatures Revisited
      date: 2017
      authors: Dominique Schröder and Dominique Unruh
      published: Journal of Cryptology
      impact: 1.3
      type: 1
      pages: 470-494
      myurl: 2017_Security_of_Blind_Signatures_Revisited.pdf
      abstract: 'We revisit the definition of unforgeability of blind signatures as proposed by Pointcheval and
        Stern (Journal of Cryptology 2000). Surprisingly, we show that this established definition falls short in
        two ways of what one would intuitively expect from a secure blind signature scheme: It is not excluded that
        an adversary submits the same message m twice for signing, and then produces a signature for m′ ̸= m. The
        reason is that the forger only succeeds if all messages are distinct. Moreover, it is not excluded that
        an adversary performs k signing queries and produces signatures on k + 1 messages as long as each of these
        signatures does not pass verification with probability 1. Finally, we proposed a new definition, honest-user
        unforgeability, that covers these attacks. We give a simple and efficient transformation that transforms
        any unforgeable blind signature scheme (with deterministic verification) into an honest-user unforgeable
        one.'
  - year: 2016
    papers:
    - title: Efficient Cryptographic Password Hardening Services From Partially Oblivious Commitments
      abstract: Password authentication still constitutes the most widespread authentication concept on the Internet
        today, but the human incapability to memorize safe passwords has left this concept vulnerable to various
        attacks ever since. Affected enterprises such as Facebook now strive to mitigate such attacks by involving
        external cryptographic services that harden passwords. Everspaugh et al. provided the first comprehensive
        formal treatment of such a service, and proposed the Pythia PRF-Service as a cryptographically secure solution
        (Usenix Security’15). Pythia relies on a novel cryptographic primitive called partially oblivious pseudorandom
        functions and its security is proven under a strong new interactive assumption in the random oracle model.
        In this work, we prove that this strong assumption is inherently necessary for the Pythia construction,
        i.e., it cannot be weakened without invalidating the security of Pythia. More generally, it is impossible
        to reduce the security of Pythia to any non-interactive assumptions. Hence any efficient, scalable password
        hardening service that is secure under weaker assumptions necessarily requires a conceptually different
        construction. To this end, we propose a construction for password hardening services based on a novel cryptographic
        primitive called partially oblivious commitments, along with an efficient secure instantiation based on
        simple assumptions. The performance and storage evaluation of our prototype implementation shows that our
        protocol runs almost twice as fast as Pythia, while achieving a slightly relaxed security notion but relying
        on weaker assumptions.
      abstract_source: /publications/2016_Efficient_Cryptographic_Password_Hardening_Services_from_Partially_Oblivious_Commitments.pdf
      date: 2016
      authors: Jonas Schneider, Nils Fleischhacker, Dominique Schröder, and Michael Backes
      published: ACM CCS
      pages: 1192-1203
      myurl: 2016_Efficient_Cryptographic_Password_Hardening_Services_from_Partially_Oblivious_Commitments.pdf
      type: 0
    - title: Efficient Sanitizable Signatures without Random Oracles
      abstract: Sanitizable signatures, introduced by Ateniese et al. (ESORICS ’05), allow the signer to delegate
        the sanitization right of signed messages. The sanitizer can modify the message and update the signature
        accordingly, so that the sanitized part of the message is kept private. For a stronger protection of sensitive
        information, it is desirable that no one can link sanitized messagesignature pairs of the same document.
        This idea was formalized by Brzuska et al. (PKC ’10) as unlinkability, which was followed up recently by
        Fleischhacker et al. (PKC ’16). Unfortunately, the existing generic constructions of sanitizable signatures,
        unlinkable or not, are based on building blocks with specially crafted features of which efficient (standard
        model) instantiations are absent. Basing on existing primitives or a conceptually simple primitive is more
        desirable. In this work, we present two such generic constructions, leading to efficient instantiations
        in the standard model. The first one is based on rerandomizable tagging, a new primitive which may find
        independent interests. It captures the core accountability mechanism of sanitizable signatures. The second
        one is based on accountable ring signatures (CARDIS ’04, ESORICS ’15). As an intermediate result, we propose
        the first accountable ring signature scheme in the standard model.
      abstract_source: /publications/2016_Efficient_Sanitizable_Signatures_without_Random_Oracles.pdf
      date: 2016
      authors: Russell W. F. Lai, Tao Zhang, ShermanChow and Dominique Schröder
      published: ESORICS
      pages: 363-380
      myurl: 2016_Efficient_Sanitizable_Signatures_without_Random_Oracles.pdf
      type: 0
    - title: Two Message Oblivious Evaluation of Cryptographic Functionalities
      abstract: We study the problem of two round oblivious evaluation of cryptographic functionalities. In this
        setting, one party P1 holds a private key sk for a provably secure instance of a cryptographic functionality
        F and the second party P2 wishes to evaluate Fsk on a value x. Although it has been known for 22 years that
        general functionalities cannot be computed securely in the presence of malicious adversaries with only two
        rounds of communication, we show the existence of a round optimal protocol that obliviously evaluates cryptographic
        functionalities. Our protocol is provably secure against malicious receivers under standard assumptions
        and does not rely on heuristic (setup) assumptions. Our main technical contribution is a novel nonblack-box
        technique, which makes nonblack-box use of the security reduction of Fsk . Specifically, our proof of malicious
        receiver security uses the code of the reduction, which reduces the security of Fsk to some hard problem,
        in order to break that problem directly. Instantiating our framework, we obtain the first two-round oblivious
        pseudorandom function that is secure in the standard model. This question was left open since the invention
        of OPRFs in 1997.
      abstract_source: /publications/2017_Two-Message_Oblivious_Evaluation_of_Cryptographic_Functionalities.pdf
      date: 2016
      authors: Nico Doettling,  Nils Fleischhacker, Johannes Krupp, and Dominique Schröder
      published: CRYPTO
      pages: 619-648
      myurl: 2017_Two-Message_Oblivious_Evaluation_of_Cryptographic_Functionalities.pdf
      type: 0
    - title: Delegtable Functional Signatures
      abstract: "We introduce delegatable functional signatures (DFS) which support the delegation of signing capabilities\
        \ to another party, called the evaluator, with respect to a functionality F. In a DFS, the signer of a message\
        \ can choose an evaluator, specify how the evaluator can modify the signature without voiding its validity,\
        \ allow additional input and decide how the evaluator can further delegate its capabilities. \n\nThe main\
        \ contribution of this paper is twofold. First, we propose DFS, a novel cryptographic primitive that unifies\
        \ several seemingly different signature primitives, including functional signatures as defined by Boyle,\
        \ Goldwasser, and Ivan (eprint 2013/401), sanitizable signatures, identity based signatures, and blind signatures.\
        \ To achieve this unification, we present several definitions of unforgeability and privacy. Finding appropriate\
        \ and meaningful definitions in this context is challenging due to the natural mealleability of DFS and\
        \ due to the multi-party setting that may involve malicious keys. Second, we present a complete characterization\
        \ of the instantiability of DFS under common assumptions, like the existence of one-way functions. Here,\
        \ we present both positive and negative results. On the positive side we show that DFS not achieving our\
        \ notion of privacy can be constructed from one-way functions. Furthermore, we show that unforgerable and\
        \ private DFS can be constructed from doubly enhanced trapdoor permutations. On the negative side we show\
        \ that the previous result is optimal regarding its underlying assumptions presenting an impossibility result\
        \ for unforgeable private DFS from one-way permutations."
      abstract_source: /publications/2016_Delegtable_Functional_Signatures.pdf
      date: 2016
      authors: Michael Backes, Sebastian Meiser, and Dominique Schröder
      published: PKC
      pages: 357-386
      remark: Invited to a special issue of IET Information Security
      myurl: 2016_Delegtable_Functional_Signatures.pdf
      type: 0
    - title: Efficient Unlinkable Sanitizable Signatures from Signatures with Re-Randomizable Keys
      abstract: "In a sanitizable signature scheme the signer allows a designated third party, called the sanitizer,\
        \ to modify certain parts of the message and adapt the signature accordingly. Ateniese et al. (ESORICS 2005)\
        \ introduced this primitive and proposed five security properties which were formalized by Brzuska et al.\
        \ (PKC 2009). Subsequently, Brzuska et al. (PKC 2010) suggested an additional security notion, called unlinkability\
        \ which says that one cannot link sanitized message-signature pairs of the same document. Moreover, the\
        \ authors gave a generic construction based on group signatures that have a certain structure. However,\
        \ the special structure required from the group signature scheme only allows for inefficient instantiations.\
        \ \n\nHere, we present the first efficient instantiation of unlinkable sanitizable signatures. Our construction\
        \ is based on a novel type of signature schemes with re-randomizable keys. Intuitively, this property allows\
        \ to re-randomize both the signing and the verification key separately but consistently. This allows us\
        \ to sign the message with a re-randomized key and to prove in zero-knowledge that the derived key originates\
        \ from either the signer or the sanitizer. We instantiate this generic idea with Schnorr signatures and\
        \ efficient Σ-protocols, which we convert into non-interactive zero-knowledge proofs via the Fiat-Shamir\
        \ transformation. Our construction is at least one order of magnitude faster than instantiating the generic\
        \ scheme of Brzuska et al. with the most efficient group signature schemes."
      abstract_source: /publications/2016_Efficient_Unlinkable_Sanitizable_Signatures_from_Signatures_with_Re-Randomizable_Keys.pdf
      date: 2016
      authors: Nils Fleischhacker, Johannes Krupp, Giulio Malavolta, Jonas Schneider, Dominique Schröder, and Mark
        Simkin
      published: PKC
      pages: 301-330
      remark: Invited to a special issue of IET Information Security
      myurl: 2016_Efficient_Unlinkable_Sanitizable_Signatures_from_Signatures_with_Re-Randomizable_Keys.pdf
      type: 0
    - title: Nearly Optimal Verifiable Data Streaming
      abstract: The problem of verifiable data streaming (VDS) considers the setting in which a client outsources
        a large dataset to an untrusted server and the integrity of this dataset is publicly verifiable. A special
        property of VDS is that the client can append additional elements to the dataset without changing the public
        verification key. Furthermore, the client may also update elements in the dataset. All previous VDS constructions
        follow a hash-tree-based approach, but either have an upper bound on the size of the database or are only
        provably secure in the random oracle model. In this work, we give the first unbounded VDS constructions
        in the standard model. We give two constructions with different tradeoffs. The first scheme follows the
        line of hash-tree-constructions and is based on a new cryptographic primitive called Chameleon Vector Commitment
        (CVC), that may be of independent interest. A CVC is a trapdoor commitment scheme to a vector of messages
        where both commitments and openings have constant size. Due to the tree-based approach, integrity proofs
        are logarithmic in the size of the dataset. The second scheme achieves constant size proofs by combining
        a signature scheme with cryptographic accumulators, but requires computational costs on the server-side
        linear in the number of update-operations.
      abstract_source: /publications/2016_Nearly_Optimal_Verifiable_Data_Streaming.pdf
      date: 2016
      authors: Johannes Krupp, Dominique Schröder, Mark Simkin, Dario Fiore, Giuseppe Ateniese, and Stefan Nuernberger
      published: PKC
      pages: 417-445
      myurl: 2016_Nearly_Optimal_Verifiable_Data_Streaming.pdf
      type: 0
    - title: Efficient Unlinkable Sanitizable Signatures from Signatures with Re-Randomizable Keys
      date: 2016
      authors: Nils Fleischhacker, Giulio Malavolta, Dominique Schröder, and Mark Simkin
      published: IET IFS Special Issue
      impact: 1.0
      type: 1
      comment: Invited from PKC 2016
      pages: 166-183
      myurl: 2016_Efficient_Unlinkable_Sanitizable Signatures_from_Signatures_with_Re-Randomizable_Keys.pdf
      abstract: In a sanitizable signature scheme the signer allows a designated third party, called the sanitizer,
        to modify certain parts of the message and adapt the signature accordingly. Ateniese et al. (ESORICS 2005)
        introduced this primitive and proposed five security properties which were formalized by Brzuska et al.
        (PKC 2009). Subsequently, Brzuska et al. (PKC 2010) suggested an additional security notion, called unlinkability
        which says that one cannot link sanitized message-signature pairs of the same document. Moreover, the authors
        gave a generic con- struction based on group signatures that have a certain structure. How- ever, the special
        structure required from the group signature scheme only allows for inefficient instantiations. Here, we
        present the first efficient instantiation of unlinkable sanitiz- able signatures. Our construction is based
        on a novel type of signature schemes with re-randomizable keys. Intuitively, this property allows to re-randomize
        both the signing and the verification key separately but consistently. This allows us to sign the message
        with a re-randomized key and to prove in zero-knowledge that the derived key originates from either the
        signer or the sanitizer. We instantiate this generic idea with Schnorr signatures and efficient Σ-protocols,
        which we convert into non- interactive zero-knowledge proofs via the Fiat-Shamir transformation. Our construction
        is at least one order of magnitude faster than instanti- ating the generic scheme of Brzuska et al. with
        the most efficient group signature schemes.
    - title: Delegtable Functional Signatures
      date: 2016
      authors: Sebastian Meiser and Dominique Schröder.
      published: IET IFS Special Issue
      impact: 1.0
      type: 1
      comment: Invited from PKC 2016
      pages: 194-206
      myurl: https://eprint.iacr.org/2013/408.pdf
      abstract: We introduce delegatable functional signatures (DFS) which support the delegation of signing capabilities
        to another party, called the evaluator, with respect to a functionality F. In a DFS, the signer of a message
        can choose an evaluator, specify how the evaluator can modify the signature without voiding its validity,
        allow additional input and decide how the evaluator can further delegate its capabilities. The main contribution
        of this paper is twofold. First, we propose DFS, a novel cryptographic primitive that unifies several seemingly
        different signature primitives, including functional sig- natures as defined by Boyle, Goldwasser, and Ivan
        (eprint 2013/401), sanitizable signatures, identity based signatures, and blind signatures. To achieve this
        unification, we present several definitions of unforgeability and privacy. Finding appropriate and meaningful
        definitions in this context is challenging due to the natural mealleability of DFS and due to the multi-party
