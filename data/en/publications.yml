  - year: 2015
    papers:
    - title: Efficient Pseudorandom Functions via On-the-Fly Adaptation
      abstract: "Pseudorandom functions (PRFs) are one of the most fundamental building blocks in cryptography with\
        \ numerous applications such as message authentication codes and private key encryption. In this work, we\
        \ propose a new framework to construct PRFs with the overall goal to build efficient PRFs from standard\
        \ assumptions with an almost tight proof of security. The main idea of our framework is to start from a\
        \ PRF for any small domain (i.e. poly-sized domain) and turn it into an ℓ-bounded pseudorandom function,\
        \ i.e., into a PRF whose outputs are pseudorandom for the first ℓ distinct queries to F . In the second\
        \ step, we apply a novel technique which we call on-the-fly adaptation that turns any bounded PRF into a\
        \ fully-fledged (large domain) PRF. Both steps of our framework have a tight security reduction, meaning\
        \ that any successful attacker can be turned into an efficient algorithm for the underlying hard computational\
        \ problem without any significant increase in the running time or loss of success probability. \n\nInstantiating\
        \ our framework with specific number theoretic assumptions, we construct a PRF based on k-LIN (and thus\
        \ DDH) that is faster than all known constructions, which reduces almost tightly to the underlying problem,\
        \ and which has shorter keys. Instantiating our framework with general assumptions, we construct a PRF with\
        \ very flat circuits whose security tightly reduces to the security of some small domain PRF."
      abstract_source: /publications/2015_Efficient_Pseudorandom_Functions_via_On-the-Fly_Adaptation.pdf
      date: 2015
      authors: Nico Döttling and Dominique Schröder
      published: CRYPTO
      pages: 329-350
      myurl: 2015_Efficient_Pseudorandom_Functions_via_On-the-Fly_Adaptation.pdf
      type: 0
    - title: Privacy and Access Control for Outsourced Personal Records
      abstract: Cloud storage has rapidly become a cornerstone of many IT infrastructures, constituting a seamless
        solution for the backup, synchronization, and sharing of large amounts of data. Putting user data in the
        direct control of cloud service providers, however, raises security and privacy concerns related to the
        integrity of outsourced data, the accidental or intentional leakage of sensitive information, the profiling
        of user activities and so on. Furthermore, even if the cloud provider is trusted, users having access to
        outsourced files might be malicious and misbehave. These concerns are particularly serious in sensitive
        applications like personal health records and credit score systems. To tackle this problem, we present GORAM,
        a cryptographic system that protects the secrecy and integrity of outsourced data with respect to both an
        untrusted server and malicious clients, guarantees the anonymity and unlinkability of accesses to such data,
        and allows the data owner to share outsourced data with other clients, selectively granting them read and
        write permissions. GORAM is the first system to achieve such a wide range of security and privacy properties
        for outsourced storage. In the process of designing an efficient construction, we developed two new, generally
        applicable cryptographic schemes, namely, batched zero-knowledge proofs of shuffle and an accountability
        technique based on chameleon signatures, which we consider of independent interest. We implemented GORAM
        in Amazon Elastic Compute Cloud (EC2) and ran a performance evaluation demonstrating the scalability and
        efficiency of our construction.
      abstract_source: /publications/2015_GORAM–Group_ORAM_for_Privacy_and_Access_Control_in_Outsourced_Personal_Records.pdf
      date: 2015
      authors: Matteo Maffei, Giulio Malavolta, Manuel Reinert, and Dominique Schröder
      published: IEEE Symposium on Security and Privacy
      pages: 341-358
      myurl: 2015_GORAM–Group_ORAM_for_Privacy_and_Access_Control_in_Outsourced_Personal_Records.pdf
      type: 0
    - title: Liar, Liar, Coins on Fire! Penalizing Equivocation By Loss of Bitcoins
      abstract: We show that equivocation, i.e., making conflicting statements to others in a distributed protocol,
        can be monetarily disincentivized by the use of crypto-currencies such as Bitcoin. To this end, we design
        completely decentralized non-equivocation contracts, which make it possible to penalize an equivocating
        party by the loss of its money. At the core of these contracts, there is a novel cryptographic primitive
        called accountable assertions, which reveals the party’s Bitcoin credentials if it equivocates. Non-equivocation
        contracts are particularly useful for distributed systems that employ public append-only logs to protect
        data integrity, e.g., in cloud storage and social networks. Moreover, as double-spending in Bitcoin is a
        special case of equivocation, the contracts enable us to design a payment protocol that allows a payee to
        receive funds at several unsynchronized points of sale, while being able to penalize a double-spending payer
        after the fact.
      abstract_source: /publications/2015_Liar_Liar_Coins_on_Fire!_Penalizing Equivocation_By_Loss_of_Bitcoins.pdf
      date: 2015
      authors: Tim Ruffing, Aniket Kate, and Dominique Schröder
      published: ACM CCS
      pages: 219-230
      myurl: 2015_Liar_Liar_Coins_on_Fire!_Penalizing Equivocation_By_Loss_of_Bitcoins.pdf
      type: 0
    - title: 'Verifiably Encrypted Signatures: Security Revisited and a New Construction'
      abstract: "In structure-preserving signatures on equivalence classes (SPS-EQ-R), introduced at Asiacrypt 2014,\
        \ each message M in (G*)<sup>ℓ</sup> is associated to its projective equivalence class, and a signature\
        \ commits to the equivalence class: anybody can transfer the signature to a new, scaled, representative.\
        \ \n\nIn this work, we give the first black-box construction of a public-key encryption scheme from any\
        \ SPS-EQ-R satisfying a simple new property which we call perfect composition. The construction does not\
        \ involve any non-black-box technique and the implication is that such SPS-EQ-R cannot be constructed from\
        \ one-way functions in a black-box way. The main idea of our scheme is to build a verifiable encrypted signature\
        \ (VES) first and then apply the general transformation suggested by Calderon et al. (CT-RSA 2014). \n\n\
        The original definition of VES requires that the underlying signature scheme be correct and secure in addition\
        \ to other security properties. The latter have been extended in subsequent literature, but the former requirements\
        \ have sometimes been neglected, leaving a hole in the security notion. We show that Calderon et al.’s notion\
        \ of resolution independence fills this gap."
      abstract_source: /publications/2015_Verifiably_Encrypted_Signatures_Security_Revisited_and_a_New_Construction.pdf
      date: 2015
      authors: Christian Hanser, Max Rabkin, and Dominique Schröder
      published: ESORICS
      myurl: 2015_Verifiably_Encrypted_Signatures_Security_Revisited_and_a_New_Construction.pdf
      type: 0
    - title: VeriStream -- A Framework for Verifiable Data Streaming
      abstract: In a Verifiable Data Streaming (VDS) protocol a computationally weak client outsources his storage
        to an untrusted storage provider. Later, the client can efficiently append and update data elements in the
        already outsourced and authenticated data set. Other users can stream arbitrary subsets of the authenticated
        data and verify their integrity on-the-fly, using the data owner’s public verification key. In this work,
        we present VeriStream, a fully-fledged open source framework for verifiable data streaming with integration
        into Dropbox. At its core, our framework is based upon a novel construction of an authenticated data structure,
        which is the first one that allows verifiable data streams of unbounded length and at the same time outperforms
        the best known constructions in terms of bandwidth and computational overhead. We provide a detailed performance
        evaluation, showing that VeriStream only incurs a small bandwidth overhead, while providing various security
        guarantees, such as freshness, integrity, authenticity, and public verifiability, at the same time.
      abstract_source: /publications/2015_VeriStream–A_Framework_for_Verifiable_Data_Streaming.pdf
      date: 2015
      authors: Dominique Schröder and Mark Simkin
      published: FC
      pages: 146-164
      myurl: 2015_VeriStream–A_Framework_for_Verifiable_Data_Streaming.pdf
      type: 0
    - title: Foundations of Reconfigurable PUFs
      abstract: A Physically Unclonable Function (PUF) can be seen as a source of randomness that can be challenged
        with a stimulus and responds in a way that is to some extent unpredictable. PUFs can be used to provide
        efficient solutions for common cryptographic primitives such as identification/authentication schemes, key
        storage, and hardware-entangled cryptography. Moreover, Brzuska et al. have recently shown, that PUFs can
        be used to construct UC secure protocols (CRYPTO 2011). Most PUF instantiations, however, only provide a
        static challenge/response space which limits their usefulness for practical instantiations. To overcome
        this limitation, Katzenbeisser et al. (CHES 2011) introduced Logically Reconfigurable PUFs (LR-PUFs), with
        the idea to introduce an “update” mechanism that changes the challenge/response behaviour without physically
        replacing or modifying the hardware. In this work, we revisit LR-PUFs. We propose several new ways to characterize
        the unpredictability of LR-PUFs covering a broader class of realistic attacks and examine their relationship
        to each other. In addition, we reconcile existing constructions with these new characterizations and show
        that they can withstand stronger adversaries than originally shown. Since previous constructions are insecure
        with respect to our strongest unpredictability notion, we propose a secure construction which relies on
        the same assumptions and is almost as efficient as previous solutions.
      abstract_source: /publications/2015_Foundations_of_Reconfigurable_PUFs.pdf
      date: 2015
      authors: Jonas Schneider and Dominique Schröder
      published: ACNS
      pages: 579-594
      myurl: 2015_Foundations_of_Reconfigurable_PUFs.pdf
      type: 0
  - year: 2014
    papers:
    - title: Feasibility and Infeasibility of Secure Computation with Malicious PUFs
      abstract: "A recent line of work has explored the use of physically uncloneable functions (PUFs) for secure\
        \ computation, with the goals of (1) achieving universal composability without additional setup, and/or\
        \ (2) obtaining unconditional security (i.e., avoiding complexity-theoretic assumptions). Initial work assumed\
        \ that all PUFs, even those created by an attacker, are honestly generated. Subsequently, researchers have\
        \ investigated models in which an adversary can create malicious PUFs with arbitrary behavior. Researchers\
        \ have considered both malicious PUFs that might be stateful, as well as malicious PUFs that can have arbitrary\
        \ behavior but are guaranteed to be stateless. We settle the main open questions regarding secure computation\
        \ in the malicious-PUF model: \n\n- We prove that unconditionally secure oblivious transfer is impossible,\
        \ even in the standalone setting, if the adversary can construct (malicious) stateful PUFs. \n\n- If the\
        \ attacker is limited to creating (malicious) stateless PUFs, then universally composable two-party computation\
        \ is possible without computational assumptions."
      abstract_source: /publications/2014_Feasibility_and_Infeasibility_of_Secure_Computation_with_Malicious_PUFs.pdf
      date: 2014
      authors: Dana Dachman-Soled, Nils Fleischhacker, Jonathan Katz, Anna Lysyanskaya, and Dominique Schröder
      published: CRYPTO
      pages: 405-420
      myurl: 2014_Feasibility_and_Infeasibility_of_Secure_Computation_with_Malicious_PUFs.pdf
      type: 0
    - title: Tight Security Proofs for Schnorr Signatures
      date: 2014
      authors: Nils Fleischhacker, Tibor Jager, and Dominique Schröder
      published: ASIACRYPT
      type: 0
      pages: 512-531
      myurl: 2014_On_Tight_Security_Proofs_for_Schnorr_Signatures.pdf
      abstract: The Schnorr signature scheme is the most efficient signature scheme based on the discrete logarithm
        problem and a long line of research investigates the existence of a tight security reduction for this scheme
        in the random oracle model. Almost all re- cent works present lower tightness bounds and most recently Seurin
        (Eurocrypt 2012) showed that under certain assumptions the non-tight security proof for Schnorr sig- natures
        in the random oracle by Pointcheval and Stern (Eurocrypt 1996) is essentially optimal. All previous works
        in this direction rule out tight reductions from the (one- more) discrete logarithm problem. In this paper
        we introduce a new meta-reduction technique, which shows lower bounds for the large and very natural class
        of generic reductions. A generic reduction is independent of a particular representation of group elements.
        Most reductions in state-of-the-art security proofs have this property. It is desirable, because then the
        reduction applies generically to any concrete instantiation of the group. Our approach shows unconditionally
        that there is no tight generic reduc- tion from any natural non-interactive computational problem Π defined
        over algebraic groups to breaking Schnorr signatures, unless solving Π is easy. In an additional application
        of the new meta-reduction technique, we also uncon- ditionally rule out any (even non-tight) generic reduction
        from natural non-interactive computational problems defined over algebraic groups to breaking Schnorr signatures
        in the non-programmable random oracle model.
    - title: (Efficient) Universally Composable Oblivious Transfer Using a Minimal Number of Stateless Tokens
      date: 2014
      type: 0
      authors: Seung Geol Choi, Jonathan Katz, Dominique Schröder, Arkady Yerukhimovich, Hong-Sheng Zhou
      published: TCC
      pages: 638-662
      myurl: 2014_Efficient_Universally_Composable_Oblivious_Transfer_Using_a_Minimal_Number_of_Stateless_Tokens.pdf
      abstract: 'We continue the line of work initiated by Katz (Eurocrypt 2007) on using tamper-proof hardware
        tokens for universally composable secure computation. As our main result, we show an oblivious-transfer
        (OT) protocol in which two parties each create and exchange a single, stateless token and can then run an
        unbounded number of OTs. We also show a more efficient protocol, based only on standard symmetric-key primitives
        (block ciphers and collision-resistant hash functions), that can be used if a bounded number of OTs suffice.

        Motivated by this result, we investigate the number of stateless tokens needed for universally composable
        OT. We prove that our protocol is optimal in this regard for constructions making black-box use of the tokens
        (in a sense we define). We also show that nonblack-box techniques can be used to obtain a construction using
        only a single stateless token.'
      comment: Invited to J. Cryptology (one of 3 papers selected from TCC 2014)
    - title: 'Brief Announcement: Towards Security and Privacy for Outsourced Data in the Multi-Party Setting'
      date: 2014
      type: 0
      authors: Matteo Maffei, Giulio Malavolta, Manuel Reinert, and Dominique Schröder
      published: PODC
      pages: 144-146
      myurl: https://dl.acm.org/doi/pdf/10.1145/2611462.2611508
      abstract: Cloud storage has rapidly acquired popularity among users, constituting a seamless solution for
        the backup, synchronization, and sharing of large amounts of data. This technology, however, puts user data
        in the direct control of cloud service providers, which raises increasing security and privacy concerns
        related to the integrity of outsourced data, the accidental or intentional leakage of sensitive information,
        the profiling of user activities and so on. We present GORAM, a cryptographic system that protects the secrecy
        and integrity of the data outsourced to an untrusted server and guarantees the anonymity and unlinkability
        of consecutive accesses to such data. GORAM allows the database owner to share outsourced data with other
        clients, selectively granting them read and write permissions. GORAM is the first system to achieve such
        a wide range of security and privacy properties for outsourced storage. Technically, GORAM builds on a combination
        of ORAM to conceal data accesses, attribute-based encryption to rule the access to outsourced data, and
        zero-knowledge proofs to prove read and write permissions in a privacy-preserving manner. We implemented
        GORAM and conducted an experimental evaluation to demonstrate its feasibility.
    - title: 'Demo: Security and Privacy with Google Glass'
      abstract: In the past years wearable computing devices, such as head-mounted displays, and ubiquitous computing
        increasingly gained importance. Head-mounted displays are comprised of a front-facing camera and a little
        screen in front of the user's eye. They provide their users with a seamless extension of their perceptual
        abilities in an unobtrusive and user-friendly manner. The Ubic-framework combines these new devices with
        mathematically sound digital cryptographic primitives and resource-friendly computer vision techniques to
        provide users with novel security and privacy guarantees in their everyday life. In our hands-on demo we
        show how Ubic allows users to read encrypted and verify digitally signed physical documents. In addition,
        we present an identification scheme, which is secure against real-world attacks, such as skimming and shoulder-surfing,
        but remains user friendly and easily deployable in current infrastructures. The Ubic-framework first appeared
        at ESORICS 2014.
      abstract_source: https://dev.cris.fau-dev.tf.fau.de/publications/107790584/
      date: 2014
      type: 0
      authors: Johannes Krupp, Dominique Schröder, and Mark Simkin
      published: CCS
      pages: 1445-1447
      myurl: 0
    - title: 'Ubic: Bridging the gap Between Digital Cryptography and the Physical World'
      date: 2014
      type: 0
      authors: Mark Simkin, Dominique Schröder, Andreas Bulling, and Mario Fritz
      published: ESORICS
      pages: 56-75
      myurl: 2014_Ubic-Bridging_the_Gap_Between_Digital_Cryptography_and_the_Physical_World.pdf
      abstract: Advances in computing technology increasingly blur the boundary between the digital domain and the
        physical world. Although the research community has developed a large number of cryptographic primitives
        and has demonstrated their usability in all-digital communication, many of them have not yet made their
        way into the real world due to usability aspects. We aim to make another step towards a tighter integration
        of digital cryptography into real world interactions. We describe Ubic, a framework that allows users to
        bridge the gap between digital cryptography and the physical world. Ubic relies on head-mounted displays,
        like Google Glass, resource-friendly computer vision techniques as well as mathematically sound cryptographic
        primitives to provide users with better security and privacy guarantees. The framework covers key cryptographic
        primitives, such as secure identification, document verification using a novel secure physical document
        format, as well as content hiding. To make a contribution of practical value, we focused on making Ubic
        as simple, easily deployable, and user friendly as possible.
    - title: WebTrust --- A Comprehensive Authenticity and Integrity Framework for HTTP
      date: 2014
      type: 0
      authors: Michael Backes, Reiner W. Gerling, Sebastian Gerling, Stefan Nürnberger, Dominique Schröder, and
        Mark Simkin
      published: ACNS
      pages: 401-418
      myurl: 0
      abstract: HTTPS is the standard for confidential and integrity-protected communication on the Web. However,
        it authenticates the server, not its content. We present WebTrust, the first comprehensive authenticity
        and integrity framework that allows on-the-fly verification of static, dynamic, and real-time streamed Web
        content from untrusted servers. Our framework seamlessly integrates into HTTP and allows to validate streamed
        content progressively at arrival. Our performance results demonstrate both the practicality and efficiency
        of our approach.
  - year: 2012
    papers:
    - title: Verifiable Data Streaming
      date: 2012
      type: 0
      authors: Dominique Schröder and Heike Schröder
      published: CCS
      pages: 953-964
      myurl: 2012_Verifiable_Data_Streaming.pdf
      abstract: In a verifiable data streaming protocol, the client streams a long string to the server who stores
        it in its database. The stream is verifiable in the sense that the server can neither change the order of
        the elements nor manipulate them. The client may also retrieve data from the database and update them. The
        content of the database is publicly verifiable such that any party in possession of some value s and a proof
        π can check that s is indeed in the database. We introduce the notion of verifiable data streaming and present
        an efficient instantiation that supports an exponential number of values based on general assumptions. Our
        main technique is an authentication tree in which the leaves are not fixed in advanced such that the user,
        knowing some trapdoor, can authenticate a new element on demand without pre- or re-computing all other leaves.
        We call this data structure chameleon authentication tree (CAT). We instantiate our scheme with primitives
        that are secure under the discrete logarithm assumption. The algebraic properties of this assumption allow
        us to obtain a very efficient verification algorithm. As a second application of CATs, we present a new
        transformation from any one-time to many-time signature scheme that is more efficient than previously known
        solutions.
      comment: Recognized with the Intel Early Career Award 2013
    - title: 'Uniqueness is a Different Story: Impossibility of Verifiable Random Functions from Trapdoor Permutations'
      abstract: "Verifiable random functions (VRFs), firstly proposed by Micali, Rabin, and Vadhan (FOCS 99), are\
        \ pseudorandom functions with the additional property that the owner of the seed SK can issue publicly-verifiable\
        \ proofs for the statements “f (SK , x) = y”, for any input x. Moreover, the output of VRFs is guaranteed\
        \ to be unique, which means that y = f (SK , x) is the only image that can be proven to map to x. Due to\
        \ their properties, VRFs are a fascinating primitive that have found several theoretical and practical applications.\
        \ However, despite their popularity, constructing VRFs seems to be a challenging task. Indeed only a few\
        \ constructions based on specific number-theoretic problems are known and basing a scheme on a general assumption\
        \ is still an open problem. Towards this direction, Brakerski, Goldwasser, Rothblum, and Vaikuntanathan\
        \ (TCC 2009) recently showed that verifiable random functions cannot be constructed from one-way permutations\
        \ in a black-box way. In this paper we put forward the study of the relationship between VRFs and well-established\
        \ cryptographic primitives. As our main result, we prove that VRFs cannot be based on the existence of trapdoor\
        \ permutations (TDPs) in a black-box manner. Our result sheds light on the nature of VRFs and can be considered\
        \ interesting for at least two reasons: \n\n- First, given the separation result of Brakerski et al., one\
        \ may think as though VRFs would naturally belong to the “public-key world”, and thus it is interesting\
        \ to figure out their relationship with other public-key primitives. In this sense, our result shows that\
        \ VRFs are much stronger because we imply separations of VRFs from most of the primitives in this world:\
        \ basically everything that is implied by TDPs is strictly weaker. These primitives include e.g., public-key\
        \ encryption (even CCA-secure), oblivious transfer, and key-agreement. \n\n- Second, the notion of VRFs\
        \ is closely related to other two primitives: weak verifiable random functions (weak-VRFs) and verifiable\
        \ pseudorandom generators (VPRGs). Weak-VRFs, defined by Brakerski et al., are a relaxation of VRFs in which\
        \ the pseudorandomness holds only with respect to random inputs. VPRGs, introduced by Dwork and Naor (FOCS\
        \ 2000), are pseudorandom generators that allow the owner of the seed to prove the correctness of subsets\
        \ of the generated bits. It is well known that “regular” PRFs can be constructed from pseudorandom generators\
        \ and from weak-PRFs in a black-box way. It was thus an open problem (already recognized by Dwork and Naor\
        \ in their paper) whether similar approaches could be applicable to the “verifiable” analogous of such primitives.\
        \ Since weak-VRFs and VPRGs are implied by TDPs, we give a negative answer to this problem showing that\
        \ the case of verifiable random functions is essentially different."
      abstract_source: /publications/2012_Uniqueness_is_a_Different_Story_Impossibility_of_Verifiable_Random_Functions_from_Trapdoor_Permutations.pdf
      date: 2012
      authors: Dario Fiore and Dominique Schröder
      published: TCC
      pages: 636-653
      myurl: 2012_Uniqueness_is_a_Different_Story_Impossibility_of_Verifiable_Random_Functions_from_Trapdoor_Permutations.pdf
      type: 0
    - title: Security of Blind Signatures Revisited
      date: 2012
      authors: Dominique Schröder and Dominique Unruh
      published: PKC
      type: 0
      pages: 662-679
      myurl: 2012_Security_of_Blind_Signatures_Revisited.pdf
      abstract: 'We revisit the definition of unforgeability of blind signatures as proposed by Pointcheval and
        Stern (Journal of Cryptology 2000). Surprisingly, we show that this established definition falls short in
        two ways of what one would intuitively expect from a secure blind signature scheme: It is not excluded that
        an adversary submits the same message m twice for signing, and then produces a signature for m′ ̸= m. The
        reason is that the forger only succeeds if all messages are distinct. Moreover, it is not excluded that
        an adversary performs k signing queries and produces signatures on k + 1 messages as long as each of these
        signatures does not pass verification with probability 1. Finally, we proposed a new definition, honest-user
        unforgeability, that covers these attacks. We give a simple and efficient transformation that transforms
        any unforgeable blind signature scheme (with deterministic verification) into an honest-user unforgeable
        one.'
    - title: History-Free Sequential Aggregate Signatures
      date: 2012
      authors: Marc Fischlin, Anja Lehmann, and Dominique Schröder
      published: SCN
      pages: 113-130
      myurl: 2012_History-Free_Sequential_Aggregate_Signatures.pdf
      type: 0
      abstract: Aggregation schemes allow to combine several cryptographic values like message authentication codes
        or signatures into a shorter value such that, despite compression, some no- tion of unforgeability is preserved.
        Recently, Eikemeier et al. (SCN 2010) considered the notion of history-free sequential aggregation for message
        authentication codes, where the sequentially- executed aggregation algorithm does not need to receive the
        previous messages in the sequence as input. Here we discuss the idea for signatures where the new aggregate
        does not rely on the pre- vious messages and public keys either, thus inhibiting the costly verifications
        in each aggregation step as in previous schemes by Lysyanskaya et al. (Eurocrypt 2004) and Neven (Eurocrypt
        2008). Analogously to MACs we argue about new security definitions for such schemes and compare them to
        previous notions for history-dependent schemes. We finally give a construction based on the BLS signature
        scheme which satisfies our notion.
    - title: Security of Blind Signatures Under Aborts and Applications to Adaptive Oblivious Transfer
      date: 2012
      authors: Marc Fischlin and Dominique Schröder.
      published: Journal Mathematical Cryptology
      impact: 0,6
      pages: 169-204
      myurl: 2012_Security_of_blind_signatures_under_aborts_and_applications_to_adaptive_oblivious_transfer.pdf
      type: 1
      abstract: 'We explore the security of blind signatures under aborts where the user or the signer may stop
        the interactive signature issue protocol prematurely. Several works on blind signatures discuss security
        only in regard of completed executions and usually do not impose strong security requirements in case of
        aborts. One of the exceptions is the paper of Camenisch, Neven and shelat (Eurocrypt 2007) where the no-
        tion of selective-failure blindness has been introduced. Roughly speaking, selective-failure blindness says
        that blindness should also hold in case the signer is able to learn that some executions have aborted. Here
        we augment the work of Camenisch et al. by showing how to turn every secure blind signature scheme into
        a selective-failure blind signa- ture scheme. Our transformation only requires an additional computa- tion
        of a commitment and therefore adds only a negligible overhead. We also study the case of multiple executions
        and notions of selective-failure blindness in this setting. We then discuss the case of user aborts and
        unforgeability under such aborts. We show that every three-move blind signature scheme remains unforgeable
        under such user aborts. Together with our transformation for selective-failure blindness we thus obtain
        an easy solution to ensure security under aborts of either party and which is applicable for example to
        the schemes of Pointcheval and Stern (Journal of Cryptology, 2000). We finally revisit the construction
        of Camenisch et al. for simulatable adaptive oblivious transfer protocols, starting from selective-failure
        blind signatures where each message only has one valid signature (uniqueness). While our transformation
        to achieve selective-failure blindness does not preserve uniqueness, it can still be combined with a modified
        version of their protocol. Hence, we can derive such oblivious transfer proto- cols based on unique blind
        signature schemes only (in the random ora- cle model), without necessarily requiring selective-failure blindness
        from scratch. '
  - year: 2011
    papers:
    - title: Round Optimal Blind Signatures
      abstract: 'All known round optimal (i.e., two-move) blind signature schemes either need a common reference
        string, rely on random oracles, or assume the hardness of some interactive assumption. At Eurocrypt 2010,
        Fischlin and Schröder showed that a broad class of three-move blind signature scheme cannot be instantiated
        in the standard model based on any non-interactive assumption. This puts forward the question if round optimal
        blind signature schemes exist in the standard model.


        Here, we give a positive answer presenting the first round optimal blind signature scheme that is secure
        in the standard model without any setup assumptions. Our solution does not need interactive assumptions.'
      abstract_source: https://eprint.iacr.org/2011/264
      date: 2011
      authors: Dominique Schröder and Dominique Unruh
      published: CRYPTO
      pages: 630-648
      myurl: https://eprint.iacr.org/2011/264
      type: 0
      comment: Merged with Sanjam Garg, Vanishree Rao, and Amit Sahai
    - title: Impossibility of Blind Signatures from One-Way Permutations
      date: 2011
      authors: Jonathan Katz, Dominique Schröder, Arkady Yerukhimovich
      published: TCC
      pages: 615-629
      myurl: 2011_Impossibility_of_Blind_Signatures_from_One-Way_Permutations.pdf
      type: 0
      abstract: A seminal result in cryptography is that signature schemes can be constructed (in a black-box fashion)
        from any one-way function. The minimal assumptions needed to construct blind signature schemes, however,
        have remained unclear. Here, we rule out black-box construc- tions of blind signature schemes from one-way
        functions. In fact, we rule out constructions even from a random permutation oracle, and our re- sults hold
        even for blind signature schemes for 1-bit messages that achieve security only against honest-but-curious
        behavior.
    - title: How to Aggregate the CL Signature
      date: 2011
      type: 0
      authors: Dominique Schröder
      published: ESORICS
      pages: 298-314
      myurl: 2011_How_to_Aggregate_the_CL_Signature_Scheme.pdf
      abstract: We present an aggregate signature scheme whose public key consists of only two group elements. It
        is therefore the first sequential ag- gregate signature scheme with short keys in the standard model. Our
        con- struction relies on the Camenisch-Lysyanskaya signature scheme (Crypto 2004) and is provably secure
        under the LRSW assumption. Moreover, we develop a novel aggregation technique that we call aggregate-extension
        technique. The basic idea is to extend the aggregate by a single element and to use this additional space
        to “store” some information that would be lost due to the compression of the signatures. We believe that
        this technique might be of independent interest
    - title: Expedient Non-Malleability Notions for Hash Functions
      date: 2011
      authors: Paul Baecher, Marc Fischlin, and Dominique Schröder
      published: CT-RSA
      pages: 268-283
      myurl: 2011_Expedient_Non-Malleability_Notions_for_Hash_Functions.pdf
      type: 0
      abstract: Non-malleability of a cryptographic primitive is a fundamental security property which ensures some
        sort of independence of cryptographic values. The notion has been extensively studied for commitments, encryption
        and zero-knowledge proofs, but it was not until recently that the notion—and its peculiarities— have been
        considered for hash functions by Boldyreva et al. (Asiacrypt 2009). They give a simulation-based definition,
        basically saying that for any adversary mauling hash values into related ones there is a simulator which
        is as successful in producing such hash values, even when not seeing the original hash values. Their notion,
        although following previous approaches to non-malleability, is nonetheless quite unwieldy; it is hard to
        achieve and, due to the existential quantification over the simulator, hard to falsify. We also note that
        finding an equivalent indistinguishability-based notion is still open. Here we take a different, more handy
        approach to non-malleability of hash functions. Our definition avoids simulators completely and rather asks
        the adversary to maul the hash value and to also specify a transfor- mation φ of the pre-image, taken from
        a fixed class Φ of admissible transformations. These transformations are usually determined by group operations
        and include such cases such as exclusive-ors (i.e., bit flips) and modular additions. We then simply demand
        that the probability of succeeding is negligible, as long as the original pre-image carries enough entropy.
        We continue to show that our notion is useful by proving that, for example, the strengthened Merkle-Damg
        ̊ard transformation meets our notion for the case of bit flips, as- suming an ideal compression function.
        We also improve over the security result by Boldyreva et al., showing that our notion of non-malleability
        suffices for the security of the Bellare-Rogaway encryption scheme.
  - year: 2010
    papers:
    - title: On the Impossibility of Three-Move Blind Signature Schemes
      date: 2010
      authors: Marc Fischlin and Dominique Schröder
      published: EUROCRYPT
      pages: 197-215
      myurl: 2010_On_the_Impossibility_of_Three-Move_Blind_Signature_Schemes.pdf
      type: 0
      abstract: 'We investigate the possibility to prove security of the well- known blind signature schemes by
        Chaum, and by Pointcheval and Stern in the standard model, i.e., without random oracles. We subsume these
        schemes under a more general class of blind signature schemes and show that finding security proofs for
        these schemes via black-box reductions in the standard model is hard. Technically, our result deploys meta-
        reduction techniques showing that black-box reductions for such schemes could be turned into efficient solvers
        for hard non-interactive crypto- graphic problems like RSA or discrete-log. Our approach yields signif-
        icantly stronger impossibility results than previous meta-reductions in other settings by playing off the
        two security requirements of the blind signatures (unforgeability and blindness). '
    - title: Unlinkability of Sanitizable Signatures
      date: 2010
      type: 0
      authors: Christina Brzuska, Marc Fischlin, Anja Lehmann, and Dominique Schröder
      published: PKC
      pages: 444-461
      myurl: 2010_Unlinkability_of_Sanitizable_Signatures.pdf
      abstract: 'Sanitizable signatures allow a designated party, called the sanitizer, to modify parts of signed
        data such that the immutable parts can still be verified with respect to the original signer. Ateniese et
        al. (ES- ORICS 2005) discuss five security properties for such signature schemes: unforgeability, immutability,
        privacy, transparency and accountability. These notions have been formalized in a recent work by Brzuska
        et al. (PKC 2009), discussing also the relationships among the security no- tions. In addition, they prove
        a modification of the scheme of Ateniese et al. to be secure according to these notions. Here we discuss
        that a sixth property of sanitizable signature schemes may be desirable: unlinkability. Basically, this
        property prevents that one can link sanitized message-signature pairs of the same document, thus allowing
        to deduce combined information about the original document. We show that this notion implies privacy, the
        inability to recover the original data of sanitized parts, but is not implied by any of the other five notions.
        We also discuss a scheme based on group signatures meeting all six security properties.'
    - title: Confidential Signatures and Deterministic Signcryption
      date: 2010
      type: 0
      authors: Alex W.~Dent, Marc Fischlin, Mark Manulis, Dominique Schröder, and Martijn Stam
      published: PKC
      pages: 462-479
      myurl: 2010_Confidential_Signatures_and_Deterministic_Signcryption.pdf
      abstract: Encrypt-and-sign, where one encrypts and signs a message in parallel, is usually not recommended
        for confidential message transmission. The reason is that the signature typically leaks information about
        the message. This motivates our investigation of confiden- tial signature schemes, which hide all information
        about (high-entropy) input messages. In this work we provide a formal treatment of confidentiality for such
        schemes and a compre- hensive discussion of the relationship of different notions we propose. We give constructions
        meeting our notions, both in the random oracle model and the standard model. As part of this we show that
        full domain hash signatures achieve a weaker level of confidentiality than Fiat-Shamir signatures. We then
        revisit the connection of confidential signatures to sign- cryption schemes. We give formal security models
        for deterministic signcryption schemes for high-entropy and low-entropy messages, and prove encrypt-and-sign
        to be secure for confidential signature schemes and high-entropy messages. Finally, we show that one can
        derandomize any signcryption scheme in our model and obtain a secure deterministic scheme.
    - title: 'Redactable Signatures for Tree-Structured Data: Definitions and Construction'
      date: 2010
      authors: Christina Brzuska, Heike Busch, Özgür Dagdelen, Marc Fischlin, Martin Franz, Stefan Katzenbeisser,
        Mark Manulis, Cristina Onete, Andreas Peters, Bertam Poettering, and Dominique Schröder
      published: ACNS
      pages: 87-104
      myurl: 2010_Redactable_Signatures_for_Tree-Structured_Data_Definitions_and_Constructions.pdf
      type: 0
      abstract: Kundu and Bertino (VLDB 2008) recently introduced the idea of structural signatures for trees which
        support public redaction of subtrees (by third-party distributors) while pertaining the integrity of the
        remaining parts. An example is given by signed XML documents of which parts should be sanitized before being
        published by a distributor not holding the signing key. Kundu and Bertino also provide a construc- tion,
        but fall short of providing formal security definitions and proofs. Here we revisit their work and give
        rigorous security models for the redactable signatures for tree-structured data, relate the notions, and
        give a construction that can be proven secure under standard cryptographic assumptions.
    - title: Generic Constructions for Verifiably Encrypted Signatures without Random Oracles or NIZKs
      abstract: Verifiably encrypted signature schemes (VES) allow a signer to encrypt his or her signature under
        the public key of a trusted third party, while maintaining public signature verifiability. With our work,
        we propose two generic constructions based on Merkle authentication trees that do not require non-interactive
        zero-knowledge proofs (NIZKs) for maintaining verifiability. Both are stateful and secure in the standard
        model. Furthermore, we extend the specification for VES, bringing it closer to real-world needs. We also
        argue that statefulness can be a feature in common business scenarios. Our constructions rely on the assumption
        that CPA (even slightly weaker) secure encryption, “maskable” CMA secure signatures, and collision resistant
        hash functions exist. “Maskable” means that a signature can be hidden in a verifiable way using a secret
        masking value. Unmasking the signature is hard without knowing the secret masking value. We show that our
        constructions can be instantiated with a broad range of efficient signature and encryption schemes, including
        two lattice-based primitives. Thus, VES schemes can be based on the hardness of worstcase lattice problems,
        making them secure against subexponential and quantum-computer attacks. Among others, we provide the first
        efficient pairing-free instantiation in the standard model.
      abstract_source: /publications/2010_Generic_Constructions_for_Verifiably_Encrypted_Signatures_Without_Random_Oracles_or_NIZKs.pdf
      date: 2010
      authors: Markus Rückert, Michael Schneider, and Dominique Schröder
      published: ACNS
      pages: 69-86
      myurl: 2010_Generic_Constructions_for_Verifiably_Encrypted_Signatures_Without_Random_Oracles_or_NIZKs.pdf
      type: 0
    - title: History-Free Aggregate Message Authentication Codes
      date: 2010
      type: 0
      authors: Oliver Eikemeier, Marc Fischlin, Jens-Fabian Götzmann, Anja Lehmann, Dominique Schröder, Peter Schröder,
        and Daniel Wagner
      published: SCN
      pages: 309-328
      myurl: 2010_History-Free_Sequential_Aggregate_Signatures.pdf
      abstract: 'Aggregate message authentication codes, as introduced by Katz and Lindell (CT-RSA 2008), combine
        several MACs into a single value, which has roughly the same size as an ordinary MAC. These schemes reduce
        the communication overhead significantly and are therefore a promising approach to achieve authenticated
        communication in mobile ad-hoc networks, where communication is prohibitively expensive. Here we revisit
        the unforgeability notion for aggregate MACs and discuss that the definition does not prevent “mix-and-match”
        attacks in which the adversary turns several aggregates into a “fresh” combination, i.e., into a valid aggregate
        on a sequence of messages which the attacker has not requested before. In particular, we show concrete attacks
        on the previous scheme.

        To capture the broader class of combination attacks, we provide a stronger security notion of aggregation
        unforgeability. While we can provide stateful transformations lifting (non-ordered) schemes to meet our
        stronger security notion, for the statefree case we switch to the new notion of history-free sequential
        aggregation. This notion is somewhat between non-ordered and sequential schemes and basically says that
        the aggregation algorithm is carried out in a sequential order but must not depend on the preceding messages
        in the sequence, but only on the shorter input aggregate and the local message. We finally show that we
        can build an aggregation-unforgeable, history-free sequential MAC scheme based on general assumptions.

        '
    - title: Fair Partially Blind Signatures
      date: 2010
      authors: Markus Rückert and Dominique Schröder
      published: Africacrypt
      pages: 34-51
      myurl: 0
      type: 0
      abstract: 'It is well-known that blind signature schemes provide full anonymity for the receiving user. For
        many real-world applications, however, this leaves too much room for fraud. There are two generalizations
        of blind signature schemes that compensate this weakness: fair blind signatures and partially blind signatures.
        Fair blind signature schemes allow a trusted third party to revoke blindness in case of a dispute. In partially
        blind signature schemes, the signer retains a certain control over the signed message because signer and
        user have to agree on a specific part of the signed message.

        In this work, we unify the previous well-studied models into a generalization, called fair partially blind
        signatures. We propose an instantiation that is secure in the standard model without any setup assumptions.
        With this construction, we also give a positive answer to the open question of whether fair blind signature
        schemes in the standard model exist.'
    - title: 'Public-Key Encryption with Non-interactive Opening: New Constructions and Stronger Definitions'
      date: 2010
      authors: David Galindo, Benoit Libert, Marc Fischlin, Georg Fuchsbauer, Anja Lehmann, Mark Manulis, and Dominique
        Schröder
      published: Africacrypt
      pages: 333-350
      myurl: 2010_Public-Key_Encryption_with_Non-Interactive_Opening-New_Constructions_and_Stronger_Definitions.pdf
      type: 0
      abstract: 'Public-key encryption schemes with non-interactive opening (PKENO) allow a receiver to non-interactively
        convince third parties that a ciphertext decrypts to a given plaintext or, alternatively, that such a ciphertext
        is invalid. Two practical generic constructions for PKENO have been proposed so far, starting from either
        identity-based encryption or public-key encryption with witness-recovering decryption (PKEWR). We show that
        the known transformation from PKEWR to PKENO fails to provide chosen-ciphertext security; only the transformation
        from identity-based encryption remains thus valid. Next, we prove that PKENO can alternatively be built
        out of robust non-interactive threshold public-key cryptosystems, a primitive that differs from identity-based
        encryption. Using the new transformation, we construct two efficient PKENO schemes: one based on the Decisional
        Diffie-Hellman assumption (in the Random-Oracle Model) and one based on the Decisional Linear assumption
        (in the standard model). Last but not least, we propose new applications of PKENO in protocol design. Motivated
        by these applications, we reconsider proof soundness for PKENO and put forward new definitions that are
        stronger than those considered so far. We give a taxonomy of all definitions and demonstrate them to be
        satisfiable.'
    - title: 'CAPTCHAs: The Good, the Bad, and the Ugly.'
      date: 2010
      authors: Paul Baecher, Lior Gordon, Marc Fischlin, Michael Luetzow, Dominique Schröder
      published: Sicherheit
      pages: 353-365
      myurl: 2010_CAPTCHAs-The_Good_the_Bad_and_the_Ugly.pdf
      type: 0
      abstract: 'A CAPTCHA is a program that generates challenges that are easy to solve for humans but difficult
        to solve for computers. The most common CAPTCHAs today are text-based ones where a short word is embedded
        in a cluttered image. In this paper, we survey the state-of-the-art of currently deployed CAPTCHAs, especially
        of some popular German sites. Surprisingly, despite their importance and the large- scale deployment, most
        of the CAPTCHAs like the ones of the “Umweltpra ̈mie”, the Bundesfinanzagentur, and the Sparda-Bank are
        rather weak. Our results show that these CAPTCHAs are subject to automated attacks solving up to 80% of
        the puzzles. Furthermore, we suggest design criteria for “good” CAPTCHAs and for the system using them.
        In light of this we revisit the popular reCAPTCHA system and latest developments about its security. Finally,
        we discuss some alternative approaches for CAPTCHAs. '
  - year: 2009
    papers:
    - title: Security of Blind Signatures Under Aborts
      date: 2009
      authors: Marc Fischlin and Dominique Schröder
      published: PKC
      pages: 117-128
      myurl: 2010_Security_of_blind_signatures_under_aborts_and_applications_to_adaptive_oblivious_transfer.pdf
      type: 0
      abstract: We explore the security of blind signatures under aborts where the user or the signer may stop the
        interactive signature issue protocol prematurely. Several works on blind signatures discuss security only
        in regard of completed executions and usually do not impose strong security requirements in case of aborts.
        One of the exceptions is the paper of Camenisch, Neven and shelat (Eurocrypt 2007) where the no- tion of
        selective-failure blindness has been introduced. Roughly speaking, selective-failure blindness says that
        blindness should also hold in case the signer is able to learn that some executions have aborted. Here we
        augment the work of Camenisch et al. by showing how to turn every secure blind signature scheme into a selective-failure
        blind signa- ture scheme. Our transformation only requires an additional computa- tion of a commitment and
        therefore adds only a negligible overhead. We also study the case of multiple executions and notions of
        selective-failure blindness in this setting. We then discuss the case of user aborts and unforgeability
        under such aborts. We show that every three-move blind signature scheme remains unforgeable under such user
        aborts. Together with our transformation for selective-failure blindness we thus obtain an easy solution
        to ensure security under aborts of either party and which is applicable for example to the schemes of Pointcheval
        and Stern (Journal of Cryptology, 2000). We finally revisit the construction of Camenisch et al. for simulatable
        adaptive oblivious transfer protocols, starting from selective-failure blind signatures where each message
        only has one valid signature (uniqueness). While our transformation to achieve selective-failure blindness
        does not preserve uniqueness, it can still be combined with a modified version of their protocol. Hence,
        we can derive such oblivious transfer proto- cols based on unique blind signature schemes only (in the random
        ora- cle model), without necessarily requiring selective-failure blindness from scratch
    - title: Security of Sanitizable Signatures Revisited
      date: 2009
      authors: Christina Brzuska, Marc Fischlin, Tobias Freudenreich, Anja Lehmann, Marcus Page, Jakob Schelbert,
        Dominique Schröder, and Florian Volk
      published: PKC
      pages: 297-316
      myurl: 2009_Security_of_Sanitizable_Signatures_Revisited.pdf
      type: 0
      abstract: Sanitizable signature schemes, as defined by Ateniese et al. (ESORICS 2005), allow a signer to partly
        delegate signing rights to an- other party, called the sanitizer. That is, the sanitizer is able to modify
        a predetermined part of the original message such that the integrity and authenticity of the unchanged part
        is still verifiable. Ateniese et al. identify five security requirements for such schemes (unforgeability,
        immutability, privacy, transparency and accountability) but do not pro- vide formal specifications for these
        properties. They also present a scheme that is supposed to satisfy these requirements. Here we revisit the
        security requirements for sanitizable signatures and, for the first time, present a comprehensive formal
        treatment. Besides a full characterization of the requirements we also investigate the relation- ship of
        the properties, showing for example that unforgeability follows from accountability. We then provide a full
        security proof for a modifi- cation of the original scheme according to our model.
    - title: Security of Verifiably Encrypted Signatures and a Construction Without Random Oracles
      date: 2009
      authors: Markus Rückert and Dominique Schröder
      published: Pairings
      pages: 17-34
      myurl: 0
      type: 0
      abstract: 'In a verifiably encrypted signature scheme, signers encrypt their signature under the public key
        of a trusted third party and prove that they did so correctly. The security properties, due to Boneh et
        al. (Eurocrypt 2003), are unforgeability and opacity.

        This paper proposes two novel fundamental requirements for verifiably encrypted signatures, called extractability
        and abuse-freeness, and analyzes its effects on the established security model. Extractability ensures that
        the trusted third party is always able to extract a valid signature from a valid verifiably encrypted signature
        and abuse-freeness guarantees that a malicious signer, who cooperates with the trusted party, is not able
        to forge a verifiably encrypted signature. We further show that both properties are not covered by the model
        of Boneh et al. The second main contribution of this paper is a verifiably encrypted signature scheme, provably
        secure without random oracles, that is more efficient and greatly improves the public key size of the only
        other construction in the standard model by Lu et al. (Eurocrypt 2006). Moreover, we present strengthened
        definitions for unforgeability and opacity in the spirit of strong unforgeability of digital signature schemes.'
    - title: Aggregate and Verifiably Encrypted Signatures from Multilinear Maps without Random Oracles
      abstract: Aggregate signatures provide bandwidth-saving aggregation of ordinary signatures. We present the
        first unrestricted instantiation without random oracles, based on the Boneh-Silverberg signature scheme.
        Moreover, our construction yields a multisignature scheme where a single message is signed by a number of
        signers. Our second result is an application to verifiably encrypted signatures. There, signers encrypt
        their signature under the public key of a trusted third party and output a proof that the signature is inside.
        Upon dispute between signer and verifier, the trusted third party is able to recover the signature. These
        schemes are provably secure in the standard model.
      abstract_source: https://link.springer.com/chapter/10.1007/978-3-642-02617-1_76
      date: 2009
      authors: Markus Rückert and Dominique Schröder
      published: ISA
      pages: 750-759
      myurl: 0
      type: 0
    - title: 'Sanitizable Signatures: How to Partially Delegate Control for Authenticated Data'
      abstract: "Sanitizable signatures have been introduced by Ateniese et al. (ESORICS 2005) and allow an authorized\
        \ party, the sanitizer, to modify a predetermined part of a signed message without invalidating the signature.\
        \ Brzuska et al. (PKC 2009) gave the first comprehensive formal treatment of the five security properties\
        \ for such schemes. These are unforgeability, immutability, privacy, transparency and accountability. They\
        \ also provide a modification of the sanitizable signature scheme proposed by Ateniese et al. such that\
        \ it provably satisfies all security requirement. Unfortunately, their scheme comes with rather large signature\
        \ sizes and produces computational overhead that increases with the number of admissible modifications.\
        \ \n\nIn this paper we show that by sacrificing the transparency property —thus allowing to distinguish\
        \ whether a message has been sanitized or not— we can obtain a sanitizable signature scheme that is still\
        \ provably secure concerning the other aforementioned properties but significantly more efficient. We propose\
        \ a construction that is based solely on regular signature schemes, produces short signatures and only adds\
        \ a small computational overhead."
      abstract_source: /publications/2009_Sanitizable_Signatures-How_to_Partially_Delegate_Control_for_Authenticated_Data.pdf
      date: 2009
      authors: Christina Brzuska, Marc Fischlin, Anja Lehmann, and Dominique Schröder
      published: BioSig
      pages: 117-128
      myurl: 0
      type: 0
  - year: 2006
    papers:
    - title: 'Mobi: Eine Infrastruktur fuer das Internet der Dinge'
      abstract: Suchmaschinen haben sich zum Auffinden von Informationen bewährt. Daher stellt sich die Frage, ob
        dieses Konzept auch auf physische Objekte erweitert werden kann. Das MobiSystem stellt dazu eine Infrastruktur
        für die Verwaltung von Gegenständen zur Verfügung. Es ermöglicht die Entdeckung, Identifikation und Lokalisierung
        von Objekten. Somit bildet das MobiSystem die Grundlage einer Suchmaschine, die effizient zum Auffinden
        und Inventarisieren von Dingen des alltäglichen Lebens eingesetzt werden kann. Umgesetzt wird dies mit Hilfe
        von RFID-Technologie, welche durch optische Verfahren ergänzt wird. Am Beispiel einer Universitätsbibliothek
        werden die Vorteile des MobiSystems erläutert.
      abstract_source: https://dl.gi.de/bitstream/handle/20.500.12116/4918/lni-s-3.pdf
      date: 2006
      authors: Michael Döring and Dominique Schröder
      published: Informatiktage
