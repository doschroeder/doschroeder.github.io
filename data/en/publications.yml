  - year: 2027
    papers:
    - title: 'BitPriv: A Privacy-Preserving Protocol for DeFi Applications on Bitcoin'
      authors: Ioannis Alexopoulos, Zeta Avarikioti, Paul Gerhart, Matteo Maffei, and Dominique Schröder
      published: NDSS
      type: 0
      pdf: https://eprint.iacr.org/2025/1575.pdf
      has_info: true
      abstract: 'Bitcoin secures over a trillion dollars in assets but remains largely absent from decentralized
        finance (DeFi) due to its restrictive scripting language. The emergence of BitVM, which enables verification
        of arbitrary off-chain computations via on-chain fraud proofs, opens the door to expressive Bitcoin-native
        applications without altering consensus rules. A key challenge for smart contracts executed on a public
        blockchain, however, is the privacy of data: bid privacy is crucial in auctions, and transaction privacy
        underlies MEV-mitigation techniques such as proposer-builder separation. While solutions exist for Ethereum,
        none apply to Bitcoin. <br> In this work, we present BitPriv, the first Bitcoin-compatible protocol to condition
        payments on the outcome of a secure two-party computation (2PC). At its core is the Garbled Hashed Timelock
        Contract (GHTLC), a generalization of HTLCs that conditions payment on garbled-circuit output labels rather
        than arbitrary hash preimages. Parties lock collateral on-chain and evaluate a garbled circuit off-chain;
        a cut-and-choose mechanism deters misbehavior, and any violation is proven and punished on-chain via BitVM.
        This design achieves security against rational adversaries: deviation is irrational under financial penalties.
        <br> We showcase BitPriv through two applications: BitMarket, the first Bitcoin-native sealed-bid auction
        protocol, and BitBridge, an intent-based cross-chain bridge built by composing BitMarket with a SNARK-verifying
        settlement layer. Optimistic settlement completes for under $3 in fees in both applications; disputes cost
        $47-$363 depending on the BitVM backend, with their mere feasibility acting as a deterrent under our compliance
        analysis. BitPriv provides a blueprint for enforceable, privacy-preserving DeFi primitives on Bitcoin without
        trusted hardware, sidechains, or consensus changes.'
  - year: 2026
    papers:
    - title: Fully Adaptive FROST with Identifiable Aborts from AOMDL
      authors: Ruben Baecker, Paul Gerhart, Davide Li Calsi, Luigi Russo, Dominique Schröder, and Arkady Yerukhimovich
      published: ASIACRYPT
      type: 0
      pdf: https://eprint.iacr.org/2025/1950.pdf
      has_info: true
      abstract: We present the first round-optimal Schnorr threshold signature scheme that achieves full adaptive
        security against algebraic adversaries, relying solely on the Algebraic One-More Discrete Log (AOMDL) assumption.
        Our scheme, FaFROST, builds on the FROST framework preserving its two-round signing structure and communication
        efficiency. By avoiding binding commitments to partial public keys, FaFROST circumvents the recent impossibility
        results from CRYPTO'25 and requires no reliance on the newly introduced, tailor-made LDVR assumption. This
        establishes that round-optimal, adaptively secure Schnorr threshold signatures are achievable under well-established
        algebraic assumptions.
    - title: Fair Distributed Exchange via Threshold Adaptor Signatures
      abstract: 'Adaptor signatures enable scriptless protocols on blockchains such as Bitcoin by allowing a buyer
        to lock a coin based on an NP statement and release payment to any party that reveals the corresponding
        witness. They underlie a broad class of layer-2 protocols, including payment channels, cross-chain swaps,
        and coin-mixing services, which today secure billions of dollars in locked value.


        Fairness for existing adaptor-signature constructions, however, is inherently two-party, so does not apply
        to deployments in which the buyer or witness holder is operated by a committee. In this work, we formalize
        and solve the fair exchange problem in that setting. We consider a buyer group holding shares of a signing
        key controlling a coin, and a seller group holding shares of a secret witness.


        The goal is to guarantee fairness both between groups (ensuring that each group obtains its asset if and
        only if the other does), as well as within groups (ensuring that all honest buyers learn the witness and
        all honest sellers receive payment), even in the presence of malicious insiders and/or partial information
        leakage. We present efficient protocols achieving these guarantees under standard cryptographic assumptions
        on scriptless blockchains with timelocks.


        Our construction introduces two new primitives of independent interest, threshold adaptor signatures and
        certified witness encryption, which we define, analyze, and instantiate efficiently.'
      abstract_source: https://eprint.iacr.org/2025/388
      authors: Ruben Baecker, Paul Gerhart, Jonathan Katz, and Dominique Schröder
      published: ASIACRYPT
      type: 0
      pdf: https://eprint.iacr.org/2025/388.pdf
      has_info: false
    - title: Universally Composable Adaptor Signatures
      authors: Paul Gerhart, Daniel Rausch, and Dominique Schröder
      published: ACM CCS
      type: 0
      pdf: https://eprint.iacr.org/2025/1363.pdf
      has_info: true
      abstract: 'Adaptor signatures extend the functionality of digital signatures by enabling the computation of
        pre-signatures on messages relative to statements in NP relations. Pre-signatures are publicly verifiable
        objects that simultaneously hide and commit to a standard signature on the same message. Anyone possessing
        a valid witness for the statement can adapt the pre-signature into a full signature under the underlying
        signature scheme. Since adaptor signatures are commonly used as building blocks in larger systems—such as
        blockchain protocols—it is natural to seek a security definition within the Universal Composability (UC)
        framework. A recent attempt by Tairi et al. (CCS’23) introduced the first UC functionality for adaptor signatures.

        This paper makes both negative and positive contributions.

        **Negative results.** We show that the functionality proposed by Tairi et al. suffers from critical limitations:

        - The functionality fails to guarantee *extractability* and *adaptability*—the core security properties
        of adaptor signatures—to higher-level protocols.

        - No adaptor signature scheme can realize the functionality.

        **Positive results.** We propose a new UC functionality that faithfully captures the latest security guarantees
        of adaptor signatures as formalized via game-based notions by Gerhart et al. (EUROCRYPT’24): - Our functionality
        guarantees extractability, *unique extractability*, and pre-signature adaptability in a way that is composable
        and meaningful for higher-level protocols. - We show that it is realizable by an enhanced Schnorr-based
        adaptor signature scheme that we construct. Our construction maintains compatibility with existing infrastructure
        and is efficient enough for practical deployment, particularly in Bitcoin-like environments.'
      myurl: 2026_Universally_Composable_Adaptor_Signatures.pdf
    - title: Fully-Adaptive Two-Round Threshold Schnorr Signatures from DDH
      authors: Paul Gerhart, Davide Li Calsi, Luigi Russo, and Dominique Schröder
      published: EUROCRYPT
      type: 0
      myurl: 2026-Fully-Adaptive-Two-Round-Threshold-Schnorr-DDH.pdf
      has_info: true
      abstract: 'Threshold Schnorr signatures enable t-out-of-n parties to collaboratively produce signatures that
        are indistinguishable from standard Schnorr signatures, ensuring compatibility with existing verification
        systems. While static-secure constructions are well understood and achieve optimal round complexity, obtaining
        full adaptive security---withstanding up to t-1 dynamic corruptions---under standard assumptions has proven
        elusive: Recent impossibility results (CRYPTO’25) either rule out known proof techniques for widely deployed
        schemes or require speculative assumptions and idealized models, while positive examples achieving full
        adaptivity from falsifiable assumptions incur higher round complexity (EUROCRYPT’25, CRYPTO’25). <br> We
        overcome these barriers with the first round-optimal threshold Schnorr signature scheme that, under a slightly
        relaxed security model, achieves full adaptive security from DDH in the random oracle model. <br> Our model
        is relaxed in the sense that the adversary may adaptively corrupt parties at any time, but each signer must
        refresh part of their public key after a fixed number of signing queries. These updates are executed via
        lightweight, succinct, stateless tokens, preserving the aggregated signature format. Our construction is
        enabled by a new proof technique, equivocal deterministic nonce derivation, which may be of independent
        interest.'
  - year: 2025
    papers:
    - title: Password-Hardened Encryption Revisited
      authors: Ruben Baecker, Paul Gerhart, and Dominique Schröder
      published: ASIACRYPT
      type: 0
      myurl: 2025_Password-Hardened_Encryption_Revisited.pdf
      has_info: true
      abstract: Passwords remain the dominant form of authentication on the Internet. The rise of single sign-on
        (SSO) services has centralized password storage, increasing the devastating impact of potential attacks
        and underscoring the need for secure storage mechanisms. A decade ago, Facebook introduced a novel approach
        to password security, later formalized in Pythia by Everspaugh et al. (USENIX'15), which proposed the concept
        of password hardening. The primary motivation behind these advances is to achieve provable security against
        offline brute-force attacks. This work initiated significant follow-on research (CCS'16, USENIX'17), including
        Password-Hardened Encryption (PHE) (USENIX'18, CCS'20), which was introduced shortly thereafter. Virgil
        Security commercializes PHE as a software-as-a-service solution and integrates it into its messenger platform
        to enhance security. <br> In this paper, we revisit PHE and provide both negative and positive contributions.
        First, we identify a critical weakness in the original design (USENIX'18) and present a practical cryptographic
        attack that enables offline brute-force attacks -- the very threat PHE was designed to mitigate. This weakness
        stems from a flawed security model that fails to account for real-world attack scenarios and the interaction
        of security properties with key rotation, a mechanism designed to enhance security by periodically updating
        keys. Our analysis shows how the independent treatment of security properties in the original model leaves
        PHE vulnerable. We demonstrate the feasibility of the attack by extracting passwords in seconds that were
        secured by the commercialized but open-source PHE provided by Virgil Security. <br> On the positive side,
        we propose a novel, highly efficient construction that addresses these shortcomings, resulting in the first
        practical PHE scheme that achieves security in a  realistic setting. We introduce a refined security model
        that accurately captures the challenges of practical deployments, and prove that our construction meets
        these requirements. Finally, we provide a comprehensive evaluation of the proposed scheme, demonstrating
        its robustness and performance.
    - title: Universally Composable and Round-Optimal Password-Hardened Encryption
      abstract: 'Password-Hardened Encryption (PHE) protects against offline brute-force attacks by involving an
        external ratelimiter that enforces rate-limited decryption without learning passwords or keys. Threshold
        Password-Hardened Encryption (TPHE), introduced by Brost et al. (CCS’20), distributes this trust among multiple
        ratelimiters. Despite its promise, the security foundations of TPHE remain unclear.


        We make three contributions: (1) We uncover a flaw in the proof of Brost et al.’s TPHE scheme, which invalidates
        its claimed security and leaves the guarantees of existing constructions uncertain; (2) We provide the first
        universal composability (UC) formalization of PHE and TPHE, unifying previous fragmented models and supporting
        key rotation, an essential feature for long-term security and related primitives such as updatable encryption;
        (3) We present the first provably secure TPHE scheme, which is both round-optimal and UC-secure, thus composable
        in real-world settings; and we implement and evaluate our protocol, demonstrating practical efficiency that
        outperforms prior work in realistic WAN scenarios.'
      abstract_source: https://eprint.iacr.org/2025/1647
      authors: Behzad Abdolmaleki, Ruben Baecker, Paul Gerhart, Mike Graf, Mojtaba Khalili, Daniel Rausch, Fritz
        Schmidt, and Dominique Schröder
      published: ASIACRYPT
      type: 0
      has_info: true
    - title: A Fully-Adaptive Threshold Partially-Oblivious PRF
      abstract: Oblivious Pseudorandom Functions (OPRFs) are fundamental cryptographic primitives essential for
        privacy-enhancing technologies such as private set intersection, oblivious keyword search, and passwordbased
        authentication protocols. We present the first fully adaptive, partially oblivious threshold pseudorandom
        function that supports proactive key refresh and provides composable security under the One-More Gap Diffie-Hellman
        assumption in the random oracle model. Our construction is secure with respect to a new ideal functionality
        for OPRFs that addresses three critical shortcomings of previous models– specifically, key refresh and non-verifiability
        issues that rendered them unrealizable. In addition, we identify a gap in a prior work’s proof of partial
        obliviousness and develop a novel proof technique to salvage their scheme.
      abstract_source: /publications/2025_A Fully-Adaptive Threshold Partially-Oblivious_PRF.pdf
      authors: Ruben Baecker, Paul Gerhart, Daniel Rausch, Dominique Schröder
      published: CRYPTO
      type: 0
      myurl: 2025_A Fully-Adaptive Threshold Partially-Oblivious_PRF.pdf
      has_info: true
    - title: Increasing the Resilience of Secure Multiparty Computation using Security Modules
      abstract: 'We investigate the problem of Secure Multiparty Computation (SMC) in a synchronous system with
        Byzantine failures where processes have access to trusted hardware. While previous solutions needed a majority
        of well-behaving processes to solve SMC, we construct an algorithm that solves SMC for an arbitrary number
        of Byzantine processes. We do this by refining and combining multiple established concepts from the literature:
        (1) We introduce a dynamic association between processes and trusted hardware modules in the hybrid system
        model of Fort et al. (TrustedPals model), (2) we utilize the primitive of Uniform Reliable Broadcast for
        information dissemination between trusted hardware modules, and (3) we use (and slightly adapt) the concept
        of Sealed Computation as an abstraction of trusted hardware modules.'
      abstract_source: https://cris.fau.de/publications/338854121/
      authors: Lamaya Omar, Felix Freiling, Dominique Schröder
      published: Transactions on Dependable and Secure Computing
      type: 1
      has_info: true
    - title: Automated Analysis and Synthesis of Message Authentication Codes
      authors: Stefan Milius, Dominik Paulus, Julian Thomas, Dominique Schröder, and Lutz Schröder
      published: CSF
      type: 0
      myurl: 2025_Automated_Analysis_and_Synthesis_of_Message_Authentication_Codes.pdf
      has_info: true
      abstract: Message Authentication Codes (MACs) represent a fundamental symmetric key primitive, serving to
        ensure the authenticity and integrity of transmitted data. As a building block in authenticated encryption
        and in numerous deployed standards, including TLS, IPsec, and SSH, MACs play a central role in practice.
        Due to their importance for practice, MACs have been subject to extensive research, leading to prominent
        schemes such as HMAC, CBCMAC, or LightMAC. Despite the existence of various MACs, there is still considerable
        interest in creating schemes that are more efficient, potentially parallelizable, or have specific non-cryptographic
        attributes, such as being patent-free. In this context, we introduce an automated method for analyzing and
        synthesizing MAC schemes. In order to achieve this goal, we have constructed a framework that restricts
        the class of MACs in such a way that it is sufficiently expressive to cover known constructions, yet also
        admits automated reasoning about the security guarantees of both known and new schemes. Our automated analysis
        has identified a novel category of MACs, termed hybrid MACs. These MACs operate by processing multiple blocks
        concurrently, with each block managed by a different, specified MAC scheme. A key finding is that in certain
        scenarios, the hybrid MAC marginally outperforms the simultaneous operation of the individual MACs. This
        improvement is attributed to the hybrid approach exploiting the strengths and compensating for the weaknesses
        of each distinct MAC scheme involved. Our implementation confirms that we successfully identified new schemes
        that have comparable performance with state-of-the-art schemes and in some settings seem to be slightly
        more efficient.
    - title: 'SoK: Descriptive Statistics Under Local Differential Privacy'
      authors: René Raab, Pascal Berrang, Paul Gerhart, and Dominique Schröder
      published: PETS
      type: 0
      myurl: 2025_SoK-Descriptive_Statistics_Under_Local_Differential_Privacy.pdf
      has_info: true
      abstract: Local Differential Privacy (LDP) provides a formal guarantee of privacy that enables the collection
        and analysis of sensitive data without revealing any individual's data. While LDP methods have been extensively
        studied, there is a lack of a systematic and empirical comparison of LDP methods for descriptive statistics.
        In this paper, we first provide a systematization of LDP methods for descriptive statistics, comparing their
        properties and requirements. We demonstrate that several mean estimation methods based on sampling from
        a Bernoulli distribution are equivalent in the one-dimensional case and introduce methods for variance estimation.
        We then empirically compare methods for mean, variance, and frequency estimation. Finally, we provide recommendations
        for the use of LDP methods for descriptive statistics and discuss their limitations and open questions.
  - year: 2024
    papers:
    - title: Measuring Conditional Anonymity - A Global Study
      authors: Pascal Berrand, Paul Gerhart, and Dominique Schröder
      published: PETS
      type: 0
      myurl: 2024-Measuring-conditional-anonymity.pdf
      abstract: 'The realm of digital health is experiencing a global surge, with mobile applications extending
        their reach into various facets of daily life. From tracking daily eating habits and vital functions to
        monitoring sleep patterns and even the menstrual cycle, these apps have become ubiquitous in their pursuit
        of comprehensive health insights. Many of these apps collect sensitive data and promise users to protect
        their privacy - often through pseudonymization. We analyze the real anonymity that users can expect by this
        approach and report on our findings. More concretely: - We introduce the notion of conditional anonymity
        sets derived from statistical properties of the population. - We measure anonymity sets for two real-world
        applications and present overarching findings from 39 countries. - We develop a graphical tool for people
        to explore their own anonymity set. One of our case studies is a popular app for tracking the menstruation
        cycle. Our findings for this app show that, despite their promise to protect privacy, the collected data
        can be used to identify users up to groups of 5 people in 97% of all the US counties, allowing the de-anonymization
        of the individuals. Given that the US Supreme Court recently overturned abortion rights, the possibility
        of determining individuals is a calamity.'
    - title: Foundations of Adaptor Signatures
      abstract: "Adaptor signatures extend the functionality of regular signatures through the computation of pre-signatures\
        \ on messages for statements of NP relations. Presignatures are publicly verifiable; they simultaneously\
        \ hide and commit to a signature of an underlying signature scheme on that message. Anybody possessing a\
        \ corresponding witness for the statement can adapt the pre-signature to obtain the “regular” signature.\
        \ Adaptor signatures have found numerous applications for conditional payments in blockchain systems, like\
        \ payment channels (CCS’20, CCS’21), private coin mixing (CCS’22, SP’23), and oracle-based payments (NDSS’23).\
        \ In our work, we revisit the state of the security of adaptor signatures and their constructions. In particular,\
        \ our two main contributions are: \n\n- Security Gaps and Definitions: We review the widely-used security\
        \ model of adaptor signatures due to Aumayr et al. (ASIACRYPT’21) and identify gaps in their definitions\
        \ that render known protocols for private coin-mixing and oracle-based payments insecure. We give simple\
        \ counterexamples of adaptor signatures that are secure w.r.t. their definitions but result in insecure\
        \ instantiations of these protocols. To fill these gaps, we identify a minimal set of modular definitions\
        \ that align with these practical applications. \n\n- Secure Constructions: Despite their popularity, all\
        \ known constructions are (1) derived from identification schemes via the Fiat-Shamir transform in the random\
        \ oracle model or (2) require modifications to the underlying signature verification algorithm, thus making\
        \ the construction useless in the setting of cryptocurrencies. More concerningly, all known constructions\
        \ were proven secure w.r.t. the insufficient definitions of Aumayr et al., leaving us with no provably secure\
        \ adaptor signature scheme to use in applications. \n\nFirstly, in this work, we salvage all current applications\
        \ by proving the security of the widely-used Schnorr adaptor signatures under our proposed definitions.\
        \ We then provide several new constructions, including presenting the first adaptor signature schemes for\
        \ Camenisch-Lysyanskaya (CL), BonehBoyen-Shacham (BBS+), and Waters signatures, all of which are proven\
        \ secure in the standard model. Our new constructions rely on a new abstraction of digital signatures, called\
        \ dichotomic signatures, which covers the essential properties we need to build adaptor signatures. Proving\
        \ the security of all constructions (including identification-based schemes) relies on a novel nonblack-box\
        \ proof technique. Both our digital signature abstraction and the proof technique could be of independent\
        \ interest to the community."
      abstract_source: /publications/2024-Foundations-Adaptor.pdf
      authors: Paul Gerhart, Dominique Schröder, Pratik Soni, and Sri A. K. Thyagarajan
      published: EUROCRYPT
      type: 0
      myurl: 2024-Foundations-Adaptor.pdf
  - year: 2023
    papers:
    - title: Practical Schnorr Threshold Signatures without the Algebraic Group Model
      authors: Hien Chu, Paul Gerhart, Tim Ruffing, Dominique Schröder
      published: CRYPTO
      type: 0
      myurl: 2023_CRYPTO_Practical_Schnorr_Signatures_ChuGerhartRuffingSchroeder.pdf
      abstract: Threshold signatures are digital signature schemes in which a set of n signers specify a threshold
        t such that any subset of size t is authorized to produce signatures on behalf of the group. There has recently
        been a renewed interest in this primitive, largely driven by the need to secure highly valuable signing
        keys, e.g., DNSSEC keys or keys protecting digital wallets in the cryptocurrency ecosystem. Of special interest
        is FROST, a practical Schnorr threshold signature scheme, which is currently undergoing standardization
        in the IETF and whose security was recently analyzed at CRYPTO 2022. We continue this line of research by
        focusing on FROSTs unforgeability combined with a practical distributed key generation (DKG) algorithm.
        Existing proofs of this setup either use non-standard heuristics, idealized group models like the AGM, or
        idealized key generation. Moreover, existing proofs do not consider all practical relevant optimizations
        that have been proposed. We close this gap between theory and practice by presenting the Schnorr threshold
        signature scheme Olaf, which combines the most efficient known FROST variant FROST3 with a variant of Pedersens
        DKG protocol (as commonly used for FROST), and prove its unforgeability. Our proof relies on the AOMDL assumption
        (a weaker and falsifiable variant of the OMDL assumption) and, like proofs of regular Schnorr signatures,
        on the random oracle model.
  - year: 2022
    papers:
    - title: 'ROAST: Robust Asynchronous Schnorr Threshold Signatures'
      abstract: "Bitcoin and other cryptocurrencies have recently introduced support for Schnorr signatures whose\
        \ cleaner algebraic structure, as compared to ECDSA, allows for simpler and more practical constructions\
        \ of highly demanded “t-of-n” threshold signatures. However, existing Schnorr threshold signature schemes\
        \ still fall short of the needs of real-world applications due to their assumption that the network is synchronous\
        \ and due to their lack of robustness, i.e., the guarantee that t honest signers are able to obtain a valid\
        \ signature even in the presence of other malicious signers who try to disrupt the protocol. This hinders\
        \ the adoption of threshold signatures in the cryptocurrency ecosystem, e.g., in second-layer protocols\
        \ built on top of cryptocurrencies. \n\nIn this work, we propose ROAST, a simple wrapper that turns a given\
        \ threshold signature scheme into a scheme with a robust and asynchronous signing protocol, as long as the\
        \ underlying signing protocol is semi-interactive (i.e., has one preprocessing round and one actual signing\
        \ round), provides identifiable aborts, and is unforgeable under concurrent signing sessions. When applied\
        \ to the state-of-the-art Schnorr threshold signature scheme FROST, which fulfills these requirements, we\
        \ obtain a simple, efficient, and highly practical Schnorr threshold signature scheme."
      abstract_source: /publications/2022_ROAST_SCHNORR_THRESHOLD_SIGNATURES.pdf
      authors: Tim Ruffing, Viktoria Ronge, Elliott Jin, Jonas Schneider-Bensch, and Dominique Schröder
      published: ACM CCS
      type: 0
      myurl: 2022_ROAST_SCHNORR_THRESHOLD_SIGNATURES.pdf
    - title: Verifiable Timed Linkable Ring Signatures For Scalable Payments for Monero
      abstract: "Decentralized cryptocurrencies still suffer from three interrelated weaknesses: Low transaction\
        \ rates, high transaction fees, and long confirmation times. Payment Channels promise to be a solution to\
        \ these issues, and many constructions for real-life cryptocurrencies, such as Bitcoin, are known. Somewhat\
        \ surprisingly, no such solution is known for Monero, the largest privacy-preserving cryptocurrency, without\
        \ requiring system-wide changes like a hard-fork of its blockchain. \n\nIn this work, we close this gap\
        \ by presenting PayMo. This first payment channel protocol is fully compatible with Monero’s transaction\
        \ scheme and can be readily used to perform off-chain payments. Notably, transactions in PayMo are identical\
        \ to standard transactions in Monero, therefore not hampering the coins’ fungibility. Using PayMo, we also\
        \ construct a provably secure and scriptless atomic-swap protocol compatible with the transaction scheme\
        \ of Monero: One can now securely swap a token of Monero with a token of several major cryptocurrencies\
        \ such as Bitcoin, Ethereum, Ripple, Cardano, etc. Before our work, atomic swaps protocol for Monero existed\
        \ only for a limited set of other currencies via ad-hoc approaches. \n\nOur main technical contribution\
        \ is a new construction of an efficient verifiable timed linkable ring signature, where signatures can be\
        \ hidden for a pre-determined amount of time in a verifiable way. Our scheme is fully compatible with the\
        \ transaction scheme of Monero, and it might be of independent interest to develop other applications on\
        \ Monero. \n\nWe implemented PayMo and our results show that, even with high network latency and with a\
        \ single CPU core, two regular users can perform up to 93500 payments over 2 minutes (the block production\
        \ rate of Monero). This is approximately five orders of magnitude improvement over the current payment rate\
        \ of Monero."
      abstract_source: /publications/2022_PAYMO_Verifiable_Timed_Linkable_Ring_Signatures.pdf
      authors: Sri A. K. Thyagarajan, Giulio Malavolta, Fritz Schmidt, Dominique Schröder
      published: ESORICS
      type: 0
      myurl: 2022_PAYMO_Verifiable_Timed_Linkable_Ring_Signatures.pdf
    - title: Inner Product Functional Commitments with Constant-Size Public Parameters and Openings
      abstract: Functional commitments (Libert et al. [ICALP’16]) allow a party to commit to a vector v of length
        n and later open the commitment at functions of the committed vector succinctly, namely with communication
        logarithmic or constant in n. Existing constructions of functional commitments rely on trusted setups and
        have either O(1) openings and O(n) parameters, or they have short parameters generatable using public randomness
        but have O(log n)-size openings. In this work, we ask whether it is possible to construct functional commitments
        in which both parameters and openings can be of constant size. Our main result is the construction of FC
        schemes matching this complexity. Our constructions support the evaluation of inner products over small
        integers; they are built using groups of unknown order and rely on succinct protocols over these groups
        that are secure in the generic group and random oracle model.
      abstract_source: /publications/2022_Inner_Product_Functional_Commitments_with_Constant-Size_Public_Parameters_and_Openings.pdf
      authors: Hien Chu, Dario Fiore, Dimitris Kolonelos, and Dominique Schröder
      published: SCN
      type: 0
      myurl: 2022_Inner_Product_Functional_Commitments_with_Constant-Size_Public_Parameters_and_Openings.pdf
    - title: Everlasting UC Commitments from Fully Malicious PUFs
      authors: Bernardo Magri, Giulio Malavolta, Dominique Schröder, and Dominique Unruh
      published: Journal of Cryptology
      impact: 1.3
      type: 1
      myurl: 2022_Everlasting_UC_Commitments_from_Fully_Malicious_PUFs.pdf
      abstract: Everlasting security models the setting where hardness assumptions hold during the execution of
        a protocol but may get broken in the future. Due to the strength of this adversarial model, achieving any
        meaningful security guarantees for composable protocols is impossible without relying on hardware assumptions
        (Müller-Quade and Unruh, JoC'10). For this reason, a rich line of research has tried to leverage physical
        assumptions to construct well-known everlasting cryptographic primitives, such as commitment schemes. The
        only known everlastingly UC secure commitment scheme, due to Müller-Quade and Unruh (JoC'10), assumes honestly
        generated hardware tokens. The authors leave the possibility of constructing everlastingly UC secure commitments
        from malicious hardware tokens as an open problem. Goyal et al. (Crypto'10) constructs unconditionally UC-secure
        commitments and secure computation from malicious hardware tokens, with the caveat that the honest tokens
        must encapsulate other tokens. This extra restriction rules out interesting classes of hardware tokens,
        such as physically uncloneable functions (PUFs).
  - year: 2021
    papers:
    - title: A Security Framework for Distributed Ledgers
      date: 2021
      authors: Mike Graf, Daniel Rausch, Viktoria Ronge, Christoph Egger, Ralf Küsters, and Dominique Schröder
      published: ACM CCS
      type: 0
      myurl: 2021_A_Security_Framework_for_Distributed_Ledgers.pdf
      abstract: In the past few years blockchains have been a major focus for security research, resulting in significant
        progress in the design, formalization, and analysis of blockchain protocols. However, the more general class
        of distributed ledgers, which includes not just blockchains but also prominent non-blockchain protocols,
        such as Corda and OmniLedger, cannot be covered by the state-of-the-art in the security literature yet.
        These distributed ledgers often break with traditional blockchain paradigms, such as block structures to
        store data, system-wide consensus, or global consistency. In this paper, we close this gap by proposing
        the first framework for defining and analyzing the security of general distributed ledgers, with an ideal
        distributed ledger functionality, called Fledger, at the core of our contribution. This functionality covers
        not only classical blockchains but also non-blockchain distributed ledgers in a unified way. To illustrate
        Fledger, we first show that the prominent ideal blockchain functionalities Gledger and GPL realize (suitable
        instantia- tions of) Fledger, which captures their security properties. This implies that their respective
        implementations, including Bitcoin, Ouroboros Genesis, and Ouroboros Crypsinous, realize Fledger as well.
        Secondly, we demonstrate that Fledger is capable of precisely modeling also non-blockchain distributed ledgers
        by performing the first formal security analysis of such a distributed ledger, namely the prominent Corda
        protocol. Due to the wide spread use of Corda in industry, in particular the financial sector, this analysis
        is of independent interest. These results also illustrate that Fledger not just generalizes the modular
        treatment of blockchains to distributed ledgers, but moreover helps to unify existing results.
    - title: 'OpenSquare: Decentralized Repeated Modular Squaring Service'
      abstract: 'Repeated Modular Squaring is a versatile computational operation that has led to practical constructions
        of timed-cryptographic primitives like time-lock puzzles (TLP) and verifiable delay functions (VDF) that
        have a fast growing list of applications. While there is a huge interest for timed-cryptographic primitives
        in the blockchains area, we find two real-world concerns that need immediate attention towards their large-scale
        practical adoption: Firstly, the requirement to constantly perform computations seems unrealistic for most
        of the users. Secondly, choosing the parameters for the bound T seems complicated due to the lack of heuristics
        and experience. We present OpenSquare, a decentralized repeated modular squaring service, that overcomes
        the above concerns. OpenSquare lets clients outsource their repeated modular squaring computation via smart
        contracts to any computationally powerful servers that offer computational services for rewards in an unlinkable
        manner. OpenSquare naturally gives us publicly computable heuristics about a pre-specified number (T) and
        the corresponding reward amounts of repeated squarings necessary for a time period. Moreover, OpenSquare
        rewards multiple servers for a single request, in a sybil resistant manner to incentivise maximum server
        participation and is therefore resistant to censorship and single-points-of failures. We give game-theoretic
        analysis to support the mechanism design of OpenSquare: (1) incentivises servers to stay available with
        their services, (2) minimizes the cost of outsourcing for the client, and (3) ensures the client receives
        the valid computational result with high probability. To demonstrate practicality, we also implement OpenSquare’s
        smart contract in Solidity and report the gas costs for all of its functions. Our results show that the
        on-chain computational costs for both the clients and the servers are quite low, and therefore feasible
        for practical deployments and usage.'
      abstract_source: /publications/2021_OpenSquare_Decentralized_Repeated_Modular_Squaring_Service.pdf
      date: 2021
      authors: Sri A. K. Thyagarajan, Adithya Bhat, Tiantian Gong, Aniket Kate, and Dominique Schröder.
      published: ACM CCS
      type: 0
      myurl: 2021_OpenSquare_Decentralized_Repeated_Modular_Squaring_Service.pdf
    - title: CoinJoin in the Wild - An Empirical Analysis in Dash
      date: 2021
      authors: Dominic Deuber and Dominique Schröder
      published: ESORICS
      type: 0
      myurl: 2021_Coin_Join_In_The_Whild_Analysis_DASH.pdf
      abstract: CoinJoin is the predominant means to enhance privacy in non-private cryptocurrencies, such as Bitcoin.
        The basic idea of CoinJoin is to create transactions that combine equal-valued coins of multiple users.
        This mixing of coins aims to prevent linkage of the users' transactional in- and outputs. The cryptocurrency
        Dash employs a built-in CoinJoin service and, therefore, is ideal for empirically studying CoinJoin. This
        paper presents the first empirical analysis of Dash, which reveals that over 40% of all private transactions
        can be de-anonymized depending on underlying assumptions. The main issue of these attacks is the coin-aggregation
        problem, i.e. the need to combine outputs of several CoinJoin transactions. The coin aggregation problem
        is not specific to Dash and affects other cryptocurrencies as empirical evidence in Bitcoin suggests. We
        show that the logical solution to the problem, namely CoinJoin transactions with non-fixed arbitrary values,
        suffers from other privacy weaknesses. We propose a novel mixing algorithm to mitigate the need for coin
        aggregation without introducing additional privacy vulnerabilities. In contrast to prior mixing algorithms,
        our approach removes the need for fixed values by dynamically creating equal-valued CoinJoin transactions.
        The mixing algorithm is not specific to Dash, and integration into other cryptocurrencies, especially into
        Bitcoin, is possible.
    - title: Foundations of Ring Sampling
      abstract: "A ring signature scheme allows the signer to sign on behalf of an ad hoc set of users, called a\
        \ ring. The verifier can be convinced that a ring member signs, but cannot point to the exact signer. Ring\
        \ signatures have become increasingly important today with their deployment in anonymous cryptocurrencies.\
        \ Conventionally, it is implicitly assumed that all ring members are equally likely to be the signer. This\
        \ assumption is generally false in reality, leading to various practical and devastating deanonymizing attacks\
        \ in Monero, one of the largest anonymous cryptocurrencies. These attacks highlight the unsatisfactory situation\
        \ that how a ring should be chosen is poorly understood. \n\nWe propose an analytical model of ring samplers\
        \ towards a deeper understanding of them through systematic studies. Our model helps to describe how anonymous\
        \ a ring sampler is with respect to a given signer distribution as an information-theoretic measure. We\
        \ show that this measure is robust, in the sense that it only varies slightly when the signer distribution\
        \ varies slightly. We then analyze three natural samplers – uniform, mimicking, and partitioning – under\
        \ our model with respect to a family of signer distributions modeled after empirical Bitcoin data. We hope\
        \ that our work paves the way towards researching ring samplers from a theoretical point of view."
      abstract_source: /publications/2021_Foundations_of_Ring_Sampling.pdf
      date: 2021
      authors: Viktoria Ronge, Christoph Egger, Russell W. F. Lai, Dominique Schröder, Hoover H. F. Yin
      published: PETS
      type: 0
      myurl: 2021_Foundations_of_Ring_Sampling.pdf
    - title: Controlling My Genome With My Smartphone a First Clinical Experiences Of The PROMISE-System
      date: 2021
      authors: Ali Amr, Marc Hinderer, Lena Griebel, Dominic Deuber, Christoph Egger, Farbod Sedaghat-Hamedani,
        Elham Kayvanpour, Daniel Huhn, Jan Haas, Karen Frese, Marc Schweig, Ninja Marnau, Annika Krämer, Claudia
        Durand, Florian Battke, Hans-Ulrich Prokosch, Michael Backes, Andreas Keller, Dominique Schröder, Hugo A.
        Katus, Norbert Frey, Benjamin Meder
      published: Clinical Research in Cardiology
      impact: 6
      type: 1
      myurl: 0
      abstract: 'A ring signature scheme allows the signer to sign on behalf of an ad hoc set of users, called a
        ring. The verifier can be convinced that a ring member signs, but cannot point to the exact signer. Ring
        signatures have become increasingly important today with their deployment in anonymous cryptocurrencies.
        Conventionally, it is implicitly assumed that all ring members are equally likely to be the signer. This
        assumption is generally false in reality, leading to various practical and devastating deanonymizing attacks
        in Monero, one of the largest anonymous cryptocurrencies. These attacks highlight the unsatisfactory situation
        that how a ring should be chosen is poorly understood.

        We propose an analytical model of ring samplers towards a deeper understanding of them through systematic
        studies. Our model helps to describe how anonymous a ring sampler is with respect to a given signer distribution
